async function salvarCadastro(t) {
  const cfg = t === 'grupos_dre' ? CAD_GDRE : CAD[t], row = {};
  for (const c of cfg.campos) {
    let v = $('c_' + c.k).value.trim();
    if (c.req && !v) return toast(`Preencha: ${c.l}.`, true), $('c_' + c.k).focus();
    if (c.t === 'money') { v = parseValor(v); if (Number.isNaN(v)) return toast(`Valor inválido em ${c.l}.`, true); }
    else if (c.t === 'int') v = parseInt(v, 10) || 0;
    else if (c.num) v = v === '' ? null : Number(v);
    else if (c.t === 'image') v = v || null;
    row[c.k] = v;
  }
  try {
    if (S.cadEdit) await store.update(t, S.cadEdit, row); else await store.insert(t, row);
    toast(S.cadEdit ? 'Alteração salva.' : 'Cadastrado com sucesso.');
    S.cadEdit = null;
    await recarregarCadastros(); renderCadastros();
    $('cadForm')?.querySelector('input,select')?.focus();
  } catch (e) { toast(e.message, true); }
}

async function excluirCadastro(t, id) {
  const r = S[t].find(x => x.id === id);
  const aviso = t === 'grupos_dre' ? '\nAs contas deste grupo ficarão sem grupo DRE.' : '';
  if (!r || !confirm(`Excluir "${r.nome}"?${aviso}`)) return;
  try { await store.remove(t, id); toast('Excluído.'); if (S.cadEdit === id) S.cadEdit = null; await recarregarCadastros(); renderCadastros(); }
  catch (e) { toast(e.message, true); }
}

function carregarImagem(file, k) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 96, sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const url = cv.toDataURL('image/png');
      $('c_' + k).value = url;
      $('c_' + k + '_prev').innerHTML = iconeBanco({ logo: url }, 34);
    };
    img.onerror = () => toast('Não foi possível ler a imagem.', true);
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}


/* ------------------------- Plano de contas: janela ------------------------- */
// Cadastro numa janela: escolhe o grupo, o código sequencial é sugerido e o grupo da DRE vem das outras contas do grupo.
let PCF = null;
const codValido = c => /^\d+(\.\d+)*$/.test(String(c ?? '').trim());
const prefixoCod = c => String(c).trim().split('.').slice(0, -1).join('.');
function proximoCodigo(gid, exceto = null) {
  const usados = new Set(S.plano_contas.filter(x => x.id !== exceto).map(x => String(x.codigo ?? '').trim()));
  const cods = S.plano_contas.filter(p => p.grupo_id === gid && p.id !== exceto).map(p => String(p.codigo ?? '').trim()).filter(codValido);
  let pre, n;
  if (cods.length) {
    const cont = {}; for (const c of cods) cont[prefixoCod(c)] = (cont[prefixoCod(c)] || 0) + 1;
    pre = Object.entries(cont).sort((a, b) => b[1] - a[1])[0][0];
    n = Math.max(...cods.filter(c => prefixoCod(c) === pre).map(c => Number(c.split('.').at(-1)) || 0)) + 1;
  } else {                       // grupo ainda sem contas: abre o próximo subgrupo (1.x receitas, 2.x despesas)
    const raiz = M.grupo[gid]?.tipo === 'RECEITA' ? '1' : '2';
    const subs = [...usados].filter(codValido).map(c => c.split('.')).filter(s => s[0] === raiz && s.length > 1).map(s => Number(s[1]) || 0);
    pre = `${raiz}.${(subs.length ? Math.max(...subs) : 0) + 1}`; n = 1;
  }
  const cod = k => pre ? `${pre}.${k}` : String(k);
  while (usados.has(cod(n))) n++;
  return cod(n);
}
function dreDoGrupo(gid, exceto = null) {
  const cont = {};
  for (const p of S.plano_contas) if (p.grupo_id === gid && p.id !== exceto && M.gdre[p.grupo_dre_id]) cont[p.grupo_dre_id] = (cont[p.grupo_dre_id] || 0) + 1;
  const m = Object.entries(cont).sort((a, b) => b[1] - a[1])[0];
  return m ? Number(m[0]) : null;
}
function abrirConta(id = null) {
  const r = id ? M.plano[id] : null;
  PCF = { id: r?.id ?? null, grupoOrig: r?.grupo_id ?? null, codOrig: r?.codigo ?? '', sug: null };
  abrirModal(`
    <div class="mh" id="pc_mh" style="--ec:${esc(r ? corGrupo(M.grupo[r.grupo_id]) : '#f37021')}">
      <div><small>Plano de contas</small><b>${r ? 'Editar conta' : 'Nova conta'}</b></div>
      <button class="ib x" data-act="fecharModal" title="Fechar (Esc)">✕</button>
    </div>
    <div class="mcorpo pc-grid">
      <label class="span2"><span>Grupo (classificação) <i>*</i></span>
        <select id="pc_grupo" data-chg="pcGrupo" ${r ? '' : 'autofocus'}><option value="">Selecione o grupo…</option>${gruposOrdenados().map(g => `<option value="${g.id}" ${g.id === r?.grupo_id ? 'selected' : ''}>${esc(g.nome)} · ${g.tipo === 'RECEITA' ? 'Receita' : 'Despesa'}</option>`).join('')}</select></label>
      <label><span>Código <i>*</i></span><input id="pc_cod" value="${esc(r?.codigo ?? '')}" placeholder="automático" inputmode="decimal" autocomplete="off"></label>
      <label><span>Nome da conta <i>*</i></span><input id="pc_nome" value="${esc(r?.nome ?? '')}" placeholder="Ex.: VENDAS DE MERCADORIAS" autocomplete="off" ${r ? 'autofocus' : ''}></label>
      <div class="pc-info span2" id="pc_info"></div>
    </div>
    <div class="mf">
      ${r ? '<button class="btn sec perigo" data-act="pcExcluir">✕ Excluir</button>' : ''}
      <span class="sp"></span>
      <button class="btn sec" data-act="fecharModal">Cancelar</button>
      <button class="btn" data-primary data-act="pcSalvar">${r ? 'Salvar alteração' : '+ Cadastrar conta'}</button>
    </div>`, 'm-ed m-pc');
  infoConta();
}
function infoConta() {
  const el = $('pc_info'); if (!el || !PCF) return;
  const gid = Number($('pc_grupo').value) || null, g = M.grupo[gid];
  if (!g) { el.innerHTML = '<span class="mut">Escolha o grupo: o próximo código da sequência é preenchido automaticamente.</span>'; return; }
  const irmas = S.plano_contas.filter(p => p.grupo_id === gid && p.id !== PCF.id).sort((a, b) => String(a.codigo).localeCompare(String(b.codigo), 'pt-BR', { numeric: true }));
  const dre = PCF.id && gid === PCF.grupoOrig ? M.plano[PCF.id]?.grupo_dre_id : dreDoGrupo(gid, PCF.id);
  el.innerHTML = `<span class="tag" style="background:${esc(corGrupo(g))}">${esc(g.nome)}</span>
    <span class="pc-tp ${g.tipo === 'RECEITA' ? 'rec' : 'desp'}">${g.tipo === 'RECEITA' ? 'Receita · soma' : 'Despesa · subtrai'}</span>
    <span class="mut">DRE: <b>${M.gdre[dre] ? esc(M.gdre[dre].nome) : 'definir em Grupos DRE'}</b></span>
    ${irmas.length ? `<span class="mut pc-ult">Últimas do grupo: ${irmas.slice(-3).map(p => `<b>${esc(p.codigo)}</b> ${esc(p.nome)}`).join(' · ')}</span>` : '<span class="mut pc-ult">Primeira conta deste grupo.</span>'}`;
  $('pc_mh')?.style.setProperty('--ec', corGrupo(g));
}
function pcGrupoMudou() {
  if (!PCF) return;
  const gid = Number($('pc_grupo').value) || null, cod = $('pc_cod');
  if (gid) {
    const atual = cod.value.trim();
    const trocar = !atual || atual === PCF.sug || (PCF.id && gid !== PCF.grupoOrig && atual === PCF.codOrig);
    if (PCF.id && gid === PCF.grupoOrig && atual === PCF.sug) { cod.value = PCF.codOrig; PCF.sug = null; }
    else if (trocar) { PCF.sug = proximoCodigo(gid, PCF.id); cod.value = PCF.sug; }
    cod.classList.remove('pc-auto'); void cod.offsetWidth; cod.classList.add('pc-auto');
  }
  infoConta();
  setTimeout(() => $('pc_nome')?.focus(), 0);
}
async function salvarConta() {
  if (!PCF) return;
  const gid = Number($('pc_grupo').value) || null, codigo = $('pc_cod').value.trim(), nome = $('pc_nome').value.trim();
  if (!gid) return toast('Escolha o grupo (classificação).', true), $('pc_grupo').focus();
  if (!codigo) return toast('Informe o código.', true), $('pc_cod').focus();
  if (!nome) return toast('Informe o nome da conta.', true), $('pc_nome').focus();
  const dup = S.plano_contas.find(p => p.id !== PCF.id && String(p.codigo).trim() === codigo);
  if (dup) return toast(`O código ${codigo} já é usado por "${dup.nome}".`, true), $('pc_cod').focus();
  const row = { codigo, nome, grupo_id: gid };
  if (!PCF.id || gid !== PCF.grupoOrig) { const d = dreDoGrupo(gid, PCF.id); if (d || !PCF.id) row.grupo_dre_id = d; }
  try {
    if (PCF.id) await store.update('plano_contas', PCF.id, row); else await store.insert('plano_contas', row);
  } catch (e) { return toast(e.message, true); }
  const novo = !PCF.id;
  fecharModal(true); PCF = null;
  await recarregarCadastros(); renderCadastros();
  toast(novo ? `Conta ${codigo} ${nome} cadastrada.` : 'Alteração salva.');
}
async function excluirConta() {
  if (!PCF?.id) return;
  const id = PCF.id; fecharModal(true); PCF = null;
  await excluirCadastro('plano_contas', id);
}

let cbAberto = null;
const semAcento = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function prepararBuscaPlano() {

    sel.focus = () => inp.focus();

    inp.addEventListener('focus', () => { inp.select(); abrirCb(sel, ''); });

    if (doGrupo.length) itens.push({ g: og.label }, ...doGrupo.map(o => ({ v: o.value, t: o.text })));
  }

  if (!pop) {

    pop.addEventListener('pointerdown', e => e.preventDefault());
    pop.addEventListener('click', e => { const o = e.target.closest('.bsel-op'); if (o) escolherCb(sel, o.dataset.v); });
    document.body.appendChild(pop);
  }
  const opcoesV = itens.filter(i => i.v);
  pop.innerHTML = opcoesV.length ? itens.map(i => i.g
    ? `<div class="cb-g"><i style="background:${esc(corGrupo(S.grupos.find(g => g.nome === i.g)))}"></i>${esc(i.g)}</div>`
    : `<div class="bsel-op ${i.v === sel.value ? 'on' : ''}" role="option" data-v="${esc(i.v)}"><span class="cod">${esc(i.t.split(' ')[0])}</span><span class="n">${esc(i.t.split(' ').slice(1).join(' '))}</span></div>`).join('')
    : '<div class="cb-vazio">Nenhuma conta encontrada</div>';
  const r = sel._inp.getBoundingClientRect(), w = Math.max(r.width, 380);

  let top = r.bottom + 4;
  if (top + pop.offsetHeight > innerHeight - 8) top = Math.max(8, r.top - pop.offsetHeight - 4);
  pop.style.top = top + 'px';
  const ops = [...pop.querySelectorAll('.bsel-op')];
  cbAberto = { sel, pop, ops, ativo: termo ? 0 : Math.max(0, ops.findIndex(o => o.dataset.v === sel.value)) };
  marcarCb(cbAberto.ativo);
}
function marcarCb(i) {
  const c = cbAberto; if (!c || !c.ops.length) return;
  c.ativo = (i + c.ops.length) % c.ops.length;
  c.ops.forEach((o, j) => o.classList.toggle('foco', j === c.ativo));

}
function teclaCb(sel, e) {
  const c = cbAberto?.sel === sel ? cbAberto : null;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!c) abrirCb(sel, ''); else marcarCb(c.ativo + (e.key === 'ArrowDown' ? 1 : -1)); }
  else if (e.key === 'Enter' && c) {
    e.preventDefault(); e.stopPropagation();
    if (c.ops.length) escolherCb(sel, c.ops[c.ativo].dataset.v);
  }
  else if (e.key === 'Tab' && c && sel._inp.value.trim() && c.ops.length && sel._inp.value !== sel.selectedOptions[0]?.text) escolherCb(sel, c.ops[c.ativo].dataset.v, false);

}
function escolherCb(sel, v, avancar = true) {
  const mudou = v !== sel.value;

function fecharCb(escolheu) {

// O <select> nativo não mostra imagens: ele continua existindo (escondido) e guarda o valor;
// um botão com o ícone do banco mostra a escolha e abre a lista com os ícones.
let bselAberto = null;
const valorSelect = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
function prepararSeletoresBanco() {

function iconeOpcao(v, size) {

  if (b) return iconeBanco(b, size);

  if (v === 'all') return `<span class="op-emp todos" style="width:${size}px;height:${size}px">${ICO_BANCOS}</span>`;
  return '';
}
const ICO_BANCOS = '<svg viewBox="0 0 24 24" width="62%" height="62%" aria-hidden="true"><path fill="currentColor" d="M12 2 2 7v2h20V7zM4 10v7h3v-7zm6.5 0v7h3v-7zM17 10v7h3v-7zM2 19v3h20v-3z"/></svg>';

    return `${g}<div class="bsel-op ${o.value === sel.value ? 'on' : ''} ${o.value ? '' : 'vazio'}" role="option" data-i="${i}">

  }).join('');
  document.body.appendChild(pop);
  const w = Math.max(r.width, 230);

    </div>`;
  (usuario ? $('l_senha') : $('l_user')).focus();
  $('l_ver').addEventListener('click', () => { const i = $('l_senha'); i.type = i.type === 'password' ? 'text' : 'password'; i.focus(); });
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const user = $('l_user').value.trim().toLowerCase(), senha = $('l_senha').value;
    $('l_ok').disabled = true; $('l_ok').textContent = 'Entrando…';
    if (MODO_SUPABASE) {
      const email = user.includes('@') ? user : `${user}@${LOGIN_DOMINIO}`;
      const { error } = await sb.auth.signInWithPassword({ email, password: senha });
      if (error) {
        const m = error.message || '';
        return renderLogin(/invalid login/i.test(m) ? 'Usuário ou senha inválidos.'
          : /not confirmed/i.test(m) ? 'Usuário ainda não confirmado. No Supabase, confirme o usuário (Auto Confirm User).'
          : /fetch|network/i.test(m) ? 'Sem conexão com o Supabase. Verifique a internet.' : 'Não foi possível entrar: ' + m, user);
      }
      S.usuario = user.split('@')[0];
    } else {
      let ok = false;
      try { ok = user === DEMO_USUARIO && await sha256(senha) === DEMO_SENHA_SHA256; } catch (err) { ok = false; }
      if (!ok) return renderLogin('Usuário ou senha inválidos.', user);
      S.usuario = user;
      try { sessionStorage.setItem('cap_sessao', user); } catch (err) {}
    }
    iniciarApp();
  });
}

/* ============================== INÍCIO ============================== */
async function iniciarApp() {
  renderShell();
  try { await recarregarCadastros(); } catch (e) { toast(e.message, true); }
  await renovarCustosFixos();
  await irPara('dash');
  await mostrarPendencias();
}

async function boot() {
  if (MODO_SUPABASE) {
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
    sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    store = new SupaStore(sb);
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return renderLogin();
    S.usuario = (session.user?.email || '').split('@')[0];
  } else {
    store = new LocalStore();
    let sessao = null;
    try { sessao = sessionStorage.getItem('cap_sessao'); } catch (e) {}
    if (!sessao) return renderLogin();
    S.usuario = sessao;
  }
  iniciarApp();
}
boot();
</script>
