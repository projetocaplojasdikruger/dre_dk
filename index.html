function dicaDash(alvo, ev) {
  const card = alvo?.closest('.dcard'); if (!card) return;
  const tip = card.querySelector('.tip');
  tip.replaceChildren();
  const t = document.createElement('div'); t.className = 'tt'; t.textContent = alvo.dataset.tt; tip.append(t);
  for (const [val, rot, cor] of JSON.parse(alvo.dataset.tv || '[]')) {
    const d = document.createElement('div');
    if (cor) { const i = document.createElement('i'); i.className = 'sw'; i.style.background = cor; d.append(i); }
    const b = document.createElement('b'); b.textContent = val; if (val.startsWith('-')) b.className = 'neg';
    d.append(b, document.createTextNode(' ' + rot)); tip.append(d);
  }
  tip.hidden = false;
  const box = card.getBoundingClientRect(), r = alvo.getBoundingClientRect();
  const px = ev?.clientX ?? (r.left + r.width / 2), py = ev?.clientY ?? (r.top + r.height / 2);
  let left = px - box.left + 16, top = py - box.top + 16;
  if (left + tip.offsetWidth > box.width - 6) left = px - box.left - tip.offsetWidth - 16;
  if (top + tip.offsetHeight > box.height - 6) top = py - box.top - tip.offsetHeight - 12;
  tip.style.left = `${Math.max(6, left)}px`; tip.style.top = `${Math.max(6, top)}px`;
  card.querySelectorAll('.hit.on').forEach(h => h !== alvo && h.classList.remove('on')); alvo.classList.add('on');
}
function esconderDicaDash(card) { if (!card) return; card.querySelector('.tip').hidden = true; card.querySelectorAll('.hit.on').forEach(h => h.classList.remove('on')); }

/* ======================= FLUXO DE CAIXA ACUMULADO ======================= */
// Visão anual mês a mês: saldo inicial, entradas e saídas por grupo, resultado e saldo acumulado.
async function viewFluxoAcum() {
  const pid = S.empresaVis === 'all' ? null : S.empresaVis;
  let lancs = [], s0 = 0;
  try { [lancs, s0] = await Promise.all([store.lancs({ ini: `${S.ano}-01-01`, fim: `${S.ano}-12-31`, planilha_id: pid }), store.saldoAte(pid, `${S.ano}-01-01`)]); }
  catch (e) { toast(e.message, true); }
  const z = () => Array(12).fill(0);
  const grp = {}, conta = {}, ent = z(), sai = z(), comDados = new Set();
  for (const l of lancs) {
    const m = Number(l.data_lancamento.slice(5, 7)) - 1, v = Number(l.valor), g = grupoDoPlano(l.plano_conta_id);
    comDados.add(m);
    (grp[g?.id ?? 0] ||= z())[m] += v;
    (conta[l.plano_conta_id] ||= z())[m] += v;
    if (sinal(l) > 0) ent[m] += v; else sai[m] += v;
  }
  const ini = z(), fim = z();
  let s = s0;
  for (let m = 0; m < 12; m++) { ini[m] = s; s = r2(s + ent[m] - sai[m]); fim[m] = s; }
  S.fa = { ...(S.fa || {}), grp, conta, ent, sai, ini, fim, s0, comDados, abertos: S.fa?.abertos || new Set() };
  renderFluxoAcum();
}

function graficoSaldo(fim, ultimo) {
  // uma série só (saldo acumulado), um eixo; dica com os valores ao passar o mouse
  const meses = [...Array(ultimo + 1).keys()];
  if (!meses.length) return '';
  const W = 1000, H = 230, L = 78, R = 16, T = 16, B = 30;
  const vals = meses.map(m => fim[m]);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi === lo) hi = lo + 1;
  const passo = (() => { const bruto = (hi - lo) / 4, p10 = 10 ** Math.floor(Math.log10(bruto)); return [1, 2, 2.5, 5, 10].map(k => k * p10).find(k => k >= bruto); })();
  lo = Math.floor(lo / passo) * passo; hi = Math.ceil(hi / passo) * passo;
  const x = m => L + (W - L - R) * (m + 0.5) / 12, y = v => T + (H - T - B) * (hi - v) / (hi - lo);
  const curto = v => { const a = Math.abs(v); return (v < 0 ? '-' : '') + (a >= 1e6 ? (a / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi' : a >= 1e3 ? Math.round(a / 1e3) + ' mil' : Math.round(a)); };
  let grade = '';
  for (let v = lo; v <= hi + passo / 2; v += passo) grade += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="${Math.abs(v) < 1e-6 ? 'zero' : 'gl'}"/><text x="${L - 8}" y="${y(v) + 4}" class="ax" text-anchor="end">${curto(v)}</text>`;
  const pts = meses.map(m => `${x(m)},${y(fim[m])}`).join(' ');
  const area = `${x(0)},${y(Math.max(lo, 0))} ${pts} ${x(ultimo)},${y(Math.max(lo, 0))}`;
  return `<div class="graf" id="grafSaldo">
    <div class="graf-t">Saldo acumulado mês a mês <span class="mut">· passe o mouse sobre os meses</span></div>
    <svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo acumulado mês a mês em ${S.ano}">
      <rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff"/>
      ${grade}
      ${MESES.map((mm, m) => `<text x="${x(m)}" y="${H - 9}" class="ax" text-anchor="middle">${mm}</text>`).join('')}
      <polygon points="${area}" class="area"/>
      <polyline points="${pts}" class="linha"/>
      ${meses.map(m => `<circle cx="${x(m)}" cy="${y(fim[m])}" r="4.5" class="pt ${fim[m] < 0 ? 'negp' : ''}"/>`).join('')}
      ${meses.map(m => `<rect x="${x(m) - (W - L - R) / 24}" y="${T}" width="${(W - L - R) / 12}" height="${H - T - B}" class="hit" data-fa-m="${m}" tabindex="0"/>`).join('')}
    </svg>
    <div class="tip" id="faTip" hidden></div>
  </div>`;
}

  if (cfg.desc) meses.reverse();
  const nMeses = ult + 1 || 1;

  const blocoGrupos = tipo => grupos(tipo).map(g => {

      + (ab ? cs.map(p => linha('sub', esc(p.codigo + ' ' + p.nome), conta[p.id], soma(conta[p.id]), true)).join('') : '');
  }).join('') || `<tr class="sub"><td class="l mut">Nenhum movimento</td><td colspan="${12 + cfg.cols.length}"></td></tr>`;
  const res = ent.map((v, m) => v - sai[m]);

  const saldoAtual = fim[Math.max(ult, 0)];

  const melhor = mesesRes.length ? mesesRes.reduce((a, m) => res[m] > res[a] ? m : a) : null;
  const pior = mesesRes.length ? mesesRes.reduce((a, m) => res[m] < res[a] ? m : a) : null;

  const body = `
    <tr class="si"><td class="l">Saldo inicial do mês</td>${meses.map(m => `<td class="${fut(m)}">${fmt(ini[m])}</td>`).join('')}${cfg.cols.map(k => k === 'total' ? `<td class="tot" title="Saldo no início do ano">${fmt(s0)}</td>` : '<td><span class="z">–</span></td>').join('')}</tr>
    ${secao('ENTRADAS', 'e')}${blocoGrupos('RECEITA')}
    ${linha('te', 'Total de entradas', ent, tEnt, true)}
    ${secao('SAÍDAS', 's')}${blocoGrupos('DESPESA')}
    ${linha('ts', 'Total de saídas', sai, tSai, true)}
    ${linha('res', 'Resultado do mês', res, tRes, true)}
    ${linha('racc', 'Resultado acumulado no ano', resAcum, tRes, false)}
    <tr class="sacc"><td class="l">Saldo acumulado</td>${meses.map(m => `<td class="${fut(m)} ${fim[m] < 0 ? 'negs' : ''}">${num2(fim[m])}</td>`).join('')}${cfg.cols.map(k => k === 'total' ? `<td class="tot" title="Saldo no fim do período">${num2(saldoAtual)}</td>` : '<td>–</td>').join('')}</tr>`;

  $('main').innerHTML = `
    ${bannerEmpresa(S.empresaVis)}
    <h2 class="tit">Fluxo de Caixa Acumulado</h2>
    <p class="sub">${S.ano} · mês a mês, com o saldo levado de um mês para o outro. Clique em um grupo para ver as contas.</p>
    <div class="barra">${abasEmpresa(S.empresaVis, 'empresaVis', true)}</div>
    <div class="barra">${barraAno()}
      <div class="filtros"><button class="mini" data-act="faTodos">${abertos.size ? 'Recolher contas' : 'Expandir contas'}</button>${botaoPers('fluxoAcum')}</div>
    </div>
    <div class="tiles">
      <div class="tile"><div class="l">Saldo inicial do ano</div><div class="v ${clsSinal(s0)}">${brl(s0)}</div><div class="s">em 01/01/${S.ano}</div></div>
      <div class="tile g"><div class="l">Entradas no ano</div><div class="v">${brl(tEnt)}</div></div>
      <div class="tile r"><div class="l">Saídas no ano</div><div class="v">${brl(tSai)}</div></div>
      <div class="tile o"><div class="l">Resultado acumulado</div><div class="v ${clsSinal(tRes)}">${brl(tRes)}</div><div class="s">${melhor != null ? `Melhor: ${MESES_NOME[melhor]} · Pior: ${MESES_NOME[pior]}` : ''}</div></div>
      <div class="tile b"><div class="l">Saldo acumulado</div><div class="v ${clsSinal(saldoAtual)}">${brl(saldoAtual)}</div><div class="s">${ult >= 0 ? `até ${MESES_NOME[ult]}` : ''}</div></div>
    </div>
    ${graficoSaldo(fim, ult)}

      <thead><tr><th style="text-align:left">Fluxo de caixa ${S.ano}</th>${meses.map(m => `<th class="${fut(m)}">${MESES[m]}</th>`).join('')}${cfg.cols.map(k => `<th>${colDef('fluxoAcum', k).h.toUpperCase()}</th>`).join('')}</tr></thead>
      <tbody>${body}</tbody>

    <p class="dica">Usa a data do lançamento. Meses futuros aparecem esmaecidos. Transferências entre bancos não alteram o caixa da empresa.</p>`;

/* ========================== BANCOS / EXTRATOS ========================== */
async function viewBancos() {
  const B = S.bk;
  if (!B.ini) { const p = periodoMes(); B.ini = p.ini; B.fim = p.fim; }
  let saldos = {}, lancs = [], transfs = [];
  try { [saldos, lancs, transfs] = await Promise.all([store.saldosBancos(B.ini), store.lancs({ ini: B.ini, fim: B.fim }), store.transfs({ ini: B.ini, fim: B.fim })]); }
  catch (e) { toast(e.message, true); }
  const mv = Object.fromEntries(S.bancos.map(b => [b.id, { ent: 0, sai: 0 }]));
  const movs = [];
  for (const l of lancs) {
    const v = sinal(l) * Number(l.valor);
    if (mv[l.banco_id]) mv[l.banco_id][v > 0 ? 'ent' : 'sai'] += Math.abs(v);
    movs.push({ data: l.data_lancamento, ord: l.id, banco: l.banco_id, emp: l.planilha_id, desc: l.item, conta: planoLabel(l.plano_conta_id), valor: v, tipo: v > 0 ? 'E' : 'S', aj: !!(l.ajustes && Object.keys(l.ajustes).length) });
  }
  for (const t of transfs) {
    const v = Number(t.valor), aj = !!(t.ajustes && Object.keys(t.ajustes).length);
    if (mv[t.banco_origem_id]) mv[t.banco_origem_id].sai += v;
    if (mv[t.banco_destino_id]) mv[t.banco_destino_id].ent += v;
    movs.push({ data: t.data, ord: t.id + 1e9, banco: t.banco_origem_id, emp: null, desc: `${t.descricao || 'Transferência'} → ${M.banco[t.banco_destino_id]?.nome ?? ''}`, conta: 'TRANSFERÊNCIA ENVIADA', valor: -v, tipo: 'T', aj });
    movs.push({ data: t.data, ord: t.id + 1e9 + .5, banco: t.banco_destino_id, emp: null, desc: `${t.descricao || 'Transferência'} ← ${M.banco[t.banco_origem_id]?.nome ?? ''}`, conta: 'TRANSFERÊNCIA RECEBIDA', valor: v, tipo: 'T', aj });
  }
  movs.sort((a, b) => a.data.localeCompare(b.data) || a.ord - b.ord);
  const tot = { ini: 0, ent: 0, sai: 0 };
  for (const b of S.bancos) { tot.ini += saldos[b.id] || 0; tot.ent += mv[b.id].ent; tot.sai += mv[b.id].sai; }
  S.bk.dados = { saldos, mv, movs, tot };
  renderBancos();
}

function renderBancos() {

function exportarCSV() {
  const { linhas, saldoAnt, filtrado } = S.bk.export || {};
  if (!linhas) return;
  const n = v => num2(v).replace(/\./g, '');
  const rows = [['Data', 'Banco', 'Empresa', 'Descrição', 'Conta', 'Entrada', 'Saída', ...(filtrado ? [] : ['Saldo'])]];
  if (!filtrado) rows.push([fmtData(S.bk.ini), '', '', 'Saldo anterior', '', '', '', n(saldoAnt)]);
  for (const m of linhas) rows.push([fmtData(m.data), M.banco[m.banco]?.nome ?? '', m.emp ? M.planilha[m.emp]?.nome ?? '' : 'TRANSFERÊNCIA', m.desc ?? '', m.conta, m.valor > 0 ? n(m.valor) : '', m.valor < 0 ? n(-m.valor) : '', ...(filtrado ? [] : [n(m.saldo)])]);
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `extrato_${S.bk.ini}_${S.bk.fim}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function salvarTransf() {
  const row = {
    data: valCampo('t_data'),
    banco_origem_id: Number(valCampo('t_origem')) || null,
    banco_destino_id: Number(valCampo('t_destino')) || null,
    descricao: valCampo('t_desc').trim(),
    valor: parseValor(valCampo('t_valor')),
  };
  if (!$('t_desc')) delete row.descricao;
  if (!row.data) return toast('Informe a data.', true);
  if (!row.banco_origem_id || !row.banco_destino_id) return toast('Escolha a conta de origem e a de destino.', true);
  if (row.banco_origem_id === row.banco_destino_id) return toast('Origem e destino precisam ser contas diferentes.', true);
  if (!(row.valor > 0)) return toast('Informe um valor maior que zero.', true), $('t_valor').focus();
  try {
    if (S.trEdit) await store.update('transferencias', S.trEdit, comAjuste(S.trLista.find(t => t.id === S.trEdit), row));
    else await store.insert('transferencias', row);
    toast(S.trEdit ? 'Transferência ajustada.' : `Transferência de ${brl(row.valor)} registrada.`);
    S.trEdit = null; await viewTransferencias(); $('t_origem').focus();
  } catch (e) { toast(e.message, true); }
}

// Gera o PDF da tela aberta (retrato ou paisagem) com cabeçalho C@P, indicadores e tabelas.
const PDF_LIBS = [
  'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
  'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js',
];
let pdfLibs;
const carregarScript = src => new Promise((ok, falha) => {
  const s = document.createElement('script');
  s.src = src; s.onload = ok;
  s.onerror = () => falha(new Error('Não foi possível carregar o gerador de PDF. Verifique a conexão com a internet.'));
  document.head.appendChild(s);
});
const libsPDF = () => pdfLibs ||= (async () => { for (const s of PDF_LIBS) await carregarScript(s); })().catch(e => { pdfLibs = null; throw e; });
let logoPdf;
const logoPNG = () => logoPdf ||= new Promise(ok => {
  const i = new Image();
  i.onload = () => { const c = document.createElement('canvas'); c.width = i.naturalWidth; c.height = i.naturalHeight; const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(i, 0, 0); ok({ url: c.toDataURL('image/jpeg', 0.92), r: i.naturalWidth / i.naturalHeight }); };
  i.src = BRAND.logoG;
});
function svgParaPNG(svg) {
  return new Promise(ok => {
    const c = svg.cloneNode(true), vb = svg.viewBox.baseVal;
    c.querySelectorAll('.hit').forEach(h => h.remove());
    const css = `.gl{stroke:#e6e6e9;stroke-width:1}.zero{stroke:#9a9ba0;stroke-width:1.2}.ax{font:12px Arial,sans-serif;fill:#74757b}.linha{fill:none;stroke:#e0620f;stroke-width:2.5;stroke-linejoin:round}.area{fill:#f37021;opacity:.08}.pt{fill:#e0620f;stroke:#fff;stroke-width:2}.negp{fill:#c62828}`;
    c.insertAdjacentHTML('afterbegin', `<style>${css}</style>`);
    c.setAttribute('width', vb.width * 2); c.setAttribute('height', vb.height * 2);
    const i = new Image();
    i.onload = () => { const cv = document.createElement('canvas'); cv.width = vb.width * 2; cv.height = vb.height * 2; cv.getContext('2d').drawImage(i, 0, 0); ok({ url: cv.toDataURL('image/png'), w: vb.width, h: vb.height }); };
    i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(c));
  });
}
// a fonte padrão do PDF não tem alguns símbolos: troca ou remove
const limparPDF = t => String(t ?? '').replace(/[▸▾▲▼⚠✓✎✕⇄⇩⚙↺Σ]/g, '').replace(/→/g, '->').replace(/←/g, '<-').replace(/−/g, '-').replace(/\s+/g, ' ').trim();
const rgb = c => { const m = String(c).match(/\d+(\.\d+)?/g); return m ? m.slice(0, 4).map(Number) : null; };
const hexRgb = h => { const x = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(x.slice(i, i + 2), 16)); };

function resumoTela() {
  const out = [];

function tabelasParaPDF() {
  let orig = [...document.querySelectorAll('#main .tabwrap table')];
  if (!orig.length && S.view === 'cadastros' && S.cadTab === 'grupos_dre') return [tabelaGruposDRE()];

    sc.forEach((s, i) => s.replaceWith(document.createTextNode(so[i].selectedOptions[0]?.text ?? '')));
    const io = t.querySelectorAll('input'), ic = c.querySelectorAll('input');
    ic.forEach((x, i) => { if (!io[i].closest('tr.entrada') && io[i].type !== 'checkbox') x.replaceWith(document.createTextNode(io[i].value + (io[i].classList.contains('mk-in') ? '%' : ''))); });
    c.querySelectorAll('tr.entrada, .caret, img, button, input').forEach(e => e.remove());
    if (t.querySelector('td.acoes')) {           // tira a coluna de ações
      c.querySelectorAll('td.acoes').forEach(e => e.remove());
      c.querySelectorAll('thead tr, tfoot tr').forEach(tr => { const l = tr.lastElementChild; if (l && !l.textContent.trim()) l.remove(); });
    }
    const w = document.createTreeWalker(c, NodeFilter.SHOW_TEXT);
    while (w.nextNode()) w.currentNode.nodeValue = limparPDF(w.currentNode.nodeValue) + ' ';
    return c;
  });
}

  const info = infoRelatorio(), cor = hexRgb(info.cor || '#f37021'), logo = await logoPNG();
  const emitido = fmtDH(new Date().toISOString());
  const TOPO = 30;

  const resumo = resumoTela();
  let y = TOPO;
  const porLinha = retrato ? 4 : 6;
  for (let i = 0; i < resumo.length; i += porLinha) {
    const parte = resumo.slice(i, i + porLinha);
    doc.autoTable({
      startY: y, head: [parte.map(r => r[0])], body: [parte.map(r => r[1])], theme: 'plain',
      margin: { left: 10, right: 10, top: TOPO },
      headStyles: { fontSize: 6.5, textColor: [116, 117, 123], fontStyle: 'bold', halign: 'center', cellPadding: { top: 1.5, bottom: 0.5 } },
      bodyStyles: { fontSize: 10, textColor: [42, 43, 47], fontStyle: 'bold', halign: 'center', cellPadding: { top: 0.5, bottom: 2 } },
      tableLineColor: [230, 230, 233], tableLineWidth: 0.2,
    });
    y = doc.lastAutoTable.finalY + 2;
  }
  if (resumo.length) y += 2;
  // gráficos da tela: dois por linha (os largos ocupam a linha toda)
  const cards = [...document.querySelectorAll('#main .graf')].filter(c => c.querySelector('svg.grafico'));
  let col = 0, alturaLinha = 0;
  const colW = (W - 26) / 2;
  for (const card of cards) {
    const img = await svgParaPNG(card.querySelector('svg.grafico'));
    const largo = card.classList.contains('s12') || !card.classList.contains('dcard');
    const maxH = retrato ? 85 : 62;                      // altura máxima de cada gráfico no PDF
    let lw = largo ? W - 20 : colW, ih = lw * img.h / img.w;
    if (ih > maxH) { lw = lw * maxH / ih; ih = maxH; }
    const bloco = ih + 12;
    if (largo && col === 1) { y += alturaLinha; col = 0; alturaLinha = 0; }
    if (y + bloco > H - 14) { doc.addPage(); y = TOPO; col = 0; alturaLinha = 0; }
    const x = largo || col === 0 ? 10 : 16 + colW;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.setTextColor(42, 43, 47);
    doc.text(limparPDF(card.querySelector('.graf-t')?.childNodes[0]?.textContent), x, y + 3);
    let lx = x + lw;                                   // legenda à direita do título
    [...card.querySelectorAll('.leg span')].reverse().forEach(sp => {
      const txt = limparPDF(sp.textContent); doc.setFont('helvetica', 'normal'); doc.setFontSize(7);
      lx -= doc.getTextWidth(txt) + 6; const c = rgb(getComputedStyle(sp.querySelector('i')).backgroundColor);
      doc.setFillColor(...c.slice(0, 3)); doc.rect(lx, y + 0.8, 2.6, 2.6, 'F'); doc.setTextColor(100, 101, 107); doc.text(txt, lx + 3.6, y + 3);
    });
    doc.addImage(img.url, 'PNG', x, y + 5, lw, ih);
    if (largo) { y += bloco; }
    else if (col === 0) { col = 1; alturaLinha = bloco; }
    else { y += Math.max(alturaLinha, bloco); col = 0; alturaLinha = 0; }
  }
  if (col === 1) y += alturaLinha;
  const host = document.createElement('div');
  host.style.cssText = 'position:absolute;left:-30000px;top:0;width:1500px';
  $('main').appendChild(host);
  try {
    for (const t of tabelasParaPDF()) {
      const box = document.createElement('div'); box.className = 'tabwrap'; box.appendChild(t); host.appendChild(box);
      const ncol = Math.max(...[...t.rows].map(r => [...r.cells].reduce((a, c) => a + (c.colSpan || 1), 0)), 1);
      const fs = retrato ? (ncol > 13 ? 4.6 : ncol > 9 ? 6 : 7.5) : (ncol > 15 ? 5.8 : ncol > 10 ? 7 : 8);
      doc.autoTable({
        html: t, startY: y, theme: 'grid', showHead: 'everyPage', showFoot: 'lastPage',
        margin: { left: 10, right: 10, top: TOPO, bottom: 14 },
        styles: { fontSize: fs, cellPadding: 1.1, overflow: 'linebreak', lineColor: [221, 222, 226], lineWidth: 0.1, textColor: [42, 43, 47], valign: 'middle' },
        headStyles: { fillColor: [88, 89, 94], textColor: 255, fontStyle: 'bold', halign: 'center' },
        footStyles: { fillColor: [233, 234, 237], textColor: [42, 43, 47], fontStyle: 'bold' },
        didParseCell: d => {                      // copia cores, negrito e alinhamento da tela
          const el = d.cell.raw;
          if (!(el instanceof Element) || d.section === 'head') return;
          const cs = getComputedStyle(el), bg = rgb(cs.backgroundColor), fg = rgb(cs.color);
          if (bg && (bg[3] === undefined || bg[3] > 0)) d.cell.styles.fillColor = bg.slice(0, 3);
          if (fg) d.cell.styles.textColor = fg.slice(0, 3);
          const inner = el.querySelector('span.neg, span.pos, b.neg, b.pos');
          if (inner) d.cell.styles.textColor = rgb(getComputedStyle(inner).color).slice(0, 3);
          if (Number(cs.fontWeight) >= 600) d.cell.styles.fontStyle = 'bold';
          const txt = d.cell.text.join(' ').trim();      // valores e datas não quebram linha
          if (/^[-+]?(R\$)?\s?[-\d.,%/]+$/.test(txt)) d.cell.styles.minCellWidth = txt.length * d.cell.styles.fontSize * 0.19 + 2.4;
          if (cs.textAlign === 'right' || cs.textAlign === 'end') d.cell.styles.halign = 'right';
          else if (cs.textAlign === 'center') d.cell.styles.halign = 'center';
        },
      });
      y = doc.lastAutoTable.finalY + 6;
    }
  } finally { host.remove(); }

  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    const lh = 16, lw = lh * logo.r;
    doc.addImage(logo.url, 'JPEG', 10, 6, lw, lh, 'logoCAP');   // mesmo alias = imagem gravada uma vez só
    doc.setTextColor(42, 43, 47); doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
    doc.text(limparPDF(info.t), 14 + lw, 12);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(100, 101, 107);
    doc.text(limparPDF([info.emp, info.per].filter(Boolean).join('   |   ')), 14 + lw, 18);
    doc.setFontSize(8); doc.text(`Emitido em ${emitido}`, W - 10, 12, { align: 'right' });
    doc.setDrawColor(...cor); doc.setLineWidth(1); doc.line(10, 25, W - 10, 25);
    doc.setDrawColor(221, 222, 226); doc.setLineWidth(0.2); doc.line(10, H - 10, W - 10, H - 10);
    doc.setFontSize(7.5); doc.setTextColor(116, 117, 123);
    doc.text('C@P Consultoria · Sistema Financeiro', 10, H - 6);
    doc.text(`Página ${i} de ${n}`, W - 10, H - 6, { align: 'right' });
  }
  const slug = s => limparPDF(s).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '_').replace(/^_|_$/g, '');
  doc.save(`CAP_${slug(info.t)}_${slug(info.emp || '')}_${slug(info.per || '')}_${retrato ? 'retrato' : 'paisagem'}.pdf`.replace(/__+/g, '_'));
  toast('PDF gerado.');
}

function campoHTML(c, val, row) {
  const v = val ?? c.def ?? (c.t === 'color' ? '#4caa4a' : '');
  if (c.t === 'select') return `<select id="c_${c.k}" ${c.req ? 'required' : ''}><option value="">${c.req ? 'Selecione…' : '— nenhum —'}</option>${c.opts().map(([id, n]) => `<option value="${id}" ${String(id) === String(v) ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
  if (c.t === 'money') return `<input id="c_${c.k}" inputmode="decimal" value="${val != null ? num2(val) : ''}" placeholder="0,00">`;
  if (c.t === 'image') return `<div class="imgf"><span id="c_${c.k}_prev">${iconeBanco({ logo: val, nome: row?.nome || '' }, 34)}</span>
      <input type="file" id="c_${c.k}_file" accept="image/*" data-chg="imgUpload" data-k="${c.k}">
      <button type="button" class="mini" data-act="imgLimpar" data-k="${c.k}" title="Volta ao ícone automático">Padrão</button>
      <input type="hidden" id="c_${c.k}" value="${esc(val ?? '')}"></div>`;
  return `<input id="c_${c.k}" type="${c.t === 'color' ? 'color' : 'text'}" value="${esc(v)}" ${c.req ? 'required' : ''} placeholder="${esc(c.ph ?? '')}" class="${c.cls ?? ''}">`;
}

          <td class="acoes"><button class="ib" title="Editar" data-act="cadEditar" data-id="${r.id}">✎</button><button class="ib del" title="Excluir" data-act="cadExcluir" data-id="${r.id}">✕</button></td></tr>`).join('')

async function salvarCadastro(t) {
  const cfg = t === 'grupos_dre' ? CAD_GDRE : CAD[t], row = {};
  for (const c of cfg.campos) {
    let v = $('c_' + c.k).value.trim();
    if (c.req && !v) return toast(`Preencha: ${c.l}.`, true), $('c_' + c.k).focus();
    if (c.t === 'money') { v = parseValor(v); if (Number.isNaN(v)) return toast(`Valor inválido em ${c.l}.`, true); }
    else if (c.t === 'int') v = parseInt(v, 10) || 0;
    else if (c.num) v = v === '' ? null : Number(v);
    else if (c.t === 'image') v = v || null;
    row[c.k] = v;
  }
  try {
    if (S.cadEdit) await store.update(t, S.cadEdit, row); else await store.insert(t, row);
    toast(S.cadEdit ? 'Alteração salva.' : 'Cadastrado com sucesso.');
    S.cadEdit = null;
    await recarregarCadastros(); renderCadastros();
    $('cadForm')?.querySelector('input,select')?.focus();
  } catch (e) { toast(e.message, true); }
}

async function excluirCadastro(t, id) {
  const r = S[t].find(x => x.id === id);
  const aviso = t === 'grupos_dre' ? '\nAs contas deste grupo ficarão sem grupo DRE.' : '';
  if (!r || !confirm(`Excluir "${r.nome}"?${aviso}`)) return;
  try { await store.remove(t, id); toast('Excluído.'); if (S.cadEdit === id) S.cadEdit = null; await recarregarCadastros(); renderCadastros(); }
  catch (e) { toast(e.message, true); }
}

function carregarImagem(file, k) {
  if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 96, sc = Math.min(1, max / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      const url = cv.toDataURL('image/png');
      $('c_' + k).value = url;
      $('c_' + k + '_prev').innerHTML = iconeBanco({ logo: url }, 34);
    };
    img.onerror = () => toast('Não foi possível ler a imagem.', true);
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

}
document.addEventListener('pointerdown', e => { if (bselAberto && !e.target.closest('.bsel-pop') && !bselAberto.sel._bt.contains(e.target)) fecharBsel(); }, true);
document.addEventListener('scroll', e => { if (bselAberto && !(e.target instanceof Element && e.target.closest('.bsel-pop'))) fecharBsel(); }, true);
window.addEventListener('resize', () => fecharBsel());

function medirCabecalhos() { document.querySelectorAll('.tabwrap.congela').forEach(w => { const h = w.querySelector('thead'); if (h) w.style.setProperty('--thh', h.offsetHeight + 'px'); }); }
new MutationObserver(() => requestAnimationFrame(() => { medirCabecalhos(); prepararSeletoresBanco(); prepararBuscaPlano(); })).observe(document.getElementById('app'), { childList: true, subtree: true });
window.addEventListener('resize', medirCabecalhos);
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'mk_custo') { S.mkCusto = e.target.value; atualizarSimulador(); }
  if (id === 'f_texto') { S.filtro.texto = e.target.value; renderLinhas(); }
  if (id === 'cadBusca') buscaViva(e.target, v => S.buscaCad = v, renderCadastros);
  if (id === 'gdreBusca') buscaViva(e.target, v => S.gdre.busca = v, renderCadastros);
  if (id === 'bk_busca') { S.bk.busca = e.target.value; clearTimeout(bkT); bkT = setTimeout(buscaBancos, 250); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.closest('tr.entrada, .lanc-form') && !e.target.matches('button')) {
    e.preventDefault();
    if (S.view === 'transferencias') salvarTransf(); else salvarLanc();
  }
  if (e.key === 'Escape' && S.editId) { S.editId = null; renderLancamentos(); }
});

/* ============================== LOGIN ============================== */
// Usuário inicial: admin / cap_2026.
// No Supabase, "admin" vira o e-mail admin@cap.local (crie esse usuário em Authentication > Users).
// No modo demonstração a senha é conferida no navegador (sem segurança real: serve só para a demonstração).
const LOGIN_DOMINIO = 'cap.local';
const DEMO_USUARIO = 'admin';
const DEMO_SENHA_SHA256 = 'ec5b2902e8b2a8df186b0a3dd310a6dd0bd9ca0bde5c085da4c60cf7eb60afd1';
async function sha256(txt) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function renderLogin(msg = '', usuario = '') {
  $('app').innerHTML = `
    <div class="login">
      <form id="loginForm" autocomplete="on">
        <div class="login-logo"><img src="${BRAND.logoG}" alt="C@P Consultoria"></div>
        <div class="login-t">Sistema Financeiro</div>
        <label>Usuário<input id="l_user" value="${esc(usuario)}" placeholder="admin" required autocomplete="username" autocapitalize="off"></label>
        <label>Senha<span class="senha"><input type="password" id="l_senha" placeholder="••••••••" required autocomplete="current-password"><button type="button" class="ver" id="l_ver" title="Mostrar senha">👁</button></span></label>
        <div class="erro">${esc(msg)}</div>
        <button class="btn" type="submit" id="l_ok">Entrar</button>
        <div class="login-rod">C@P Consultoria · ${MODO_SUPABASE ? 'acesso seguro' : 'modo demonstração'}</div>
      </form>
    </div>`;
  (usuario ? $('l_senha') : $('l_user')).focus();
  $('l_ver').addEventListener('click', () => { const i = $('l_senha'); i.type = i.type === 'password' ? 'text' : 'password'; i.focus(); });
  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const user = $('l_user').value.trim().toLowerCase(), senha = $('l_senha').value;
    $('l_ok').disabled = true; $('l_ok').textContent = 'Entrando…';
    if (MODO_SUPABASE) {
      const email = user.includes('@') ? user : `${user}@${LOGIN_DOMINIO}`;
      const { error } = await sb.auth.signInWithPassword({ email, password: senha });
      if (error) {
        const m = error.message || '';
        return renderLogin(/invalid login/i.test(m) ? 'Usuário ou senha inválidos.'
          : /not confirmed/i.test(m) ? 'Usuário ainda não confirmado. No Supabase, confirme o usuário (Auto Confirm User).'
          : /fetch|network/i.test(m) ? 'Sem conexão com o Supabase. Verifique a internet.' : 'Não foi possível entrar: ' + m, user);
      }
      S.usuario = user.split('@')[0];
    } else {
      let ok = false;
      try { ok = user === DEMO_USUARIO && await sha256(senha) === DEMO_SENHA_SHA256; } catch (err) { ok = false; }
      if (!ok) return renderLogin('Usuário ou senha inválidos.', user);
      S.usuario = user;
      try { sessionStorage.setItem('cap_sessao', user); } catch (err) {}
    }
    iniciarApp();
  });
}

/* ============================== INÍCIO ============================== */
async function iniciarApp() {
  renderShell();
  try { await recarregarCadastros(); } catch (e) { toast(e.message, true); }
  await irPara('dash');
}

async function boot() {
  if (MODO_SUPABASE) {
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm');
    sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    store = new SupaStore(sb);
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return renderLogin();
    S.usuario = (session.user?.email || '').split('@')[0];
  } else {
    store = new LocalStore();
    let sessao = null;
    try { sessao = sessionStorage.getItem('cap_sessao'); } catch (e) {}
    if (!sessao) return renderLogin();
    S.usuario = sessao;
  }
  iniciarApp();
}
boot();
</script>
