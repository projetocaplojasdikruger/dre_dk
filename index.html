const somaMeses = (iso, n) => { const [a, m, d] = iso.split('-').map(Number), p = new Date(a, m - 1 + n, 1); return isoData(new Date(p.getFullYear(), p.getMonth(), Math.min(d, ultimoDia(p.getFullYear(), p.getMonth())))); };
function gerarParcelas() {
  const np = Math.max(0, Math.min(360, parseInt(valCampo('e_np'), 10) || 0)), d0 = valCampo('e_data');
  const v = parseValor(valCampo('e_valor'));
  S.lf.np = np;
  if (np < 2 || !d0 || !(v > 0)) { S.lf.parc = null; return desenharParcelas(); }
  let valores;
  if (S.lf.base === 'total') {
    const base = Math.floor(v / np * 100) / 100;
    valores = Array.from({ length: np }, (_, i) => i === np - 1 ? r2(v - base * (np - 1)) : base);   // a diferença dos centavos fica na última
  } else valores = Array(np).fill(v);
  S.lf.parc = valores.map((valor, i) => ({ data: somaMeses(d0, i), valor }));
  desenharParcelas();
}
function desenharParcelas() {

  const tot = P.reduce((a, p) => a + p.valor, 0);
  box.innerHTML = `
    <div class="parc-h"><b>${P.length} parcelas</b><span class="mut">mensais · ajuste a data ou o valor de qualquer parcela</span>
      <span class="parc-tot">Total <b>${brl(tot)}</b></span></div>
    <div class="parc-grid">${P.map((p, i) => `<div class="parc ${p.ed ? 'ed' : ''}">
      <div class="pn"><b>${i + 1}</b>/${P.length}</div>
      <input type="date" value="${p.data}" data-pi="${i}" data-pk="data">
      <input inputmode="decimal" value="${num2(p.valor)}" data-pi="${i}" data-pk="valor">
    </div>`).join('')}</div>
    <div class="parc-f"><span class="mut">Cada parcela entra no fluxo de caixa e na DRE <b>na data do seu vencimento</b>, em aberto, e é paga depois pelo botão <b>Pagar</b> (continua no vencimento).</span>
      <button class="salvar" data-act="lancarParcelas">+ Lançar ${P.length} parcelas · ${brl(tot)}</button></div>`;
}
async function lancarParcelas() {

/* ============================ CUSTOS FIXOS ============================ */
// Cada custo fixo tem uma ou mais vigências (início, fim e valor). Para cada mês de vigência existe um
// lançamento em aberto (origem "CF:id"). Ao mudar as vigências, os lançamentos em aberto são recriados,
// alterados ou removidos; os já pagos e os ajustados à mão nunca são mexidos.
// Os custos fixos ficam salvos em "parametros" (chave custos_fixos).
const CF_CHAVE = 'custos_fixos';
const proxMes = ym => { const [a, m] = ym.split('-').map(Number); return m === 12 ? `${a + 1}-01` : `${a}-${pad(m + 1)}`; };
const antMes = ym => { const [a, m] = ym.split('-').map(Number); return m === 1 ? `${a - 1}-12` : `${a}-${pad(m - 1)}`; };
const fmtMes = ym => ym ? `${MESES[Number(ym.slice(5, 7)) - 1]}/${ym.slice(0, 4)}` : '';
const MES_ATUAL = HOJE.slice(0, 7);
const horizonteCF = () => `${hoje.getFullYear() + 1}-12`;      // vigência sem fim: gera até dezembro do ano que vem
const dataCF = (cf, ym) => { const [a, m] = ym.split('-').map(Number); return `${ym}-${pad(Math.min(cf.dia, ultimoDia(a, m - 1)))}`; };
const vigOrdenadas = cf => [...(cf.vigencias || [])].sort((a, b) => a.inicio.localeCompare(b.inicio));
const vigDoMes = (cf, ym) => vigOrdenadas(cf).filter(v => v.inicio <= ym && (!v.fim || v.fim >= ym)).at(-1) || null;
const fimCF = cf => { const v = vigOrdenadas(cf); return v.some(x => !x.fim) ? null : v.reduce((a, x) => x.fim > a ? x.fim : a, ''); };
const iniCF = cf => vigOrdenadas(cf)[0]?.inicio || '';
const statusCF = cf => cf.ativo === false ? 'encerrado' : iniCF(cf) > MES_ATUAL ? 'futuro' : (fimCF(cf) && fimCF(cf) < MES_ATUAL) ? 'encerrado' : 'ativo';
const valorAtualCF = cf => (vigDoMes(cf, MES_ATUAL) || (statusCF(cf) === 'futuro' ? vigOrdenadas(cf)[0] : vigOrdenadas(cf).at(-1)))?.valor ?? 0;

async function carregarCF() {
  let v = null;
  try { v = await store.getParam(CF_CHAVE); } catch (e) { toast(e.message, true); }
  S.cf.lista = Array.isArray(v) ? v : [];
  return S.cf.lista;
}
const gravarCF = () => store.setParam(CF_CHAVE, S.cf.lista);

function mesesDesejados(cf) {
  const out = new Map();
  if (cf.ativo === false) return out;
  for (const v of vigOrdenadas(cf)) {
    const fim = v.fim || horizonteCF();
    for (let ym = v.inicio; ym <= fim; ym = proxMes(ym)) out.set(ym, Number(v.valor));
  }
  return out;
}
async function sincronizarCF(cf) {
  const desej = mesesDesejados(cf), exist = await store.lancsOrigem(`CF:${cf.id}`);
  const porMes = new Map(); let alterados = 0, removidos = 0;
  for (const l of exist) {
    const ym = vencimento(l).slice(0, 7);
    if (!emAberto(l) || (l.ajustes && Object.keys(l.ajustes).length)) { porMes.set(ym, l); continue; }   // pago ou ajustado à mão: fica como está
    if (!desej.has(ym) || porMes.has(ym)) { await store.remove('lancamentos', l.id); removidos++; continue; }
    porMes.set(ym, l);
    const alvo = { planilha_id: cf.planilha_id, plano_conta_id: cf.plano_conta_id, item: cf.descricao, valor: desej.get(ym), data_lancamento: dataCF(cf, ym), data_programada: dataCF(cf, ym) };
    if (Object.keys(alvo).some(k => !mesmoValor(l[k], alvo[k]))) { await store.update('lancamentos', l.id, alvo); alterados++; }
  }
  const novos = [...desej].filter(([ym]) => !porMes.has(ym)).map(([ym, valor]) => ({
    planilha_id: cf.planilha_id, banco_id: null, plano_conta_id: cf.plano_conta_id, item: cf.descricao, valor,
    data_lancamento: dataCF(cf, ym), data_programada: dataCF(cf, ym), origem: `CF:${cf.id}` }));
  if (novos.length) await store.insertMany('lancamentos', novos);
  cf.gerado_ate = fimCF(cf) || horizonteCF();
  return { criados: novos.length, alterados, removidos };
}
// ao entrar no sistema: estende os custos fixos sem fim até o horizonte (ex.: virou o ano)
async function renovarCustosFixos() {
  try {
    await carregarCF();
    const pend = S.cf.lista.filter(cf => cf.ativo !== false && !fimCF(cf) && (cf.gerado_ate || '') < horizonteCF());
    for (const cf of pend) await sincronizarCF(cf);
    if (pend.length) await gravarCF();
  } catch (e) { console.warn('custos fixos', e); }
}
const resumoSinc = r => [r.criados && `${r.criados} criado(s)`, r.alterados && `${r.alterados} alterado(s)`, r.removidos && `${r.removidos} removido(s)`].filter(Boolean).join(', ') || 'nada a mudar';

function validarCF(cf) {
  if (!cf.planilha_id) return 'Escolha a empresa.';
  if (!cf.plano_conta_id) return 'Selecione o plano de contas.';
  if (!(cf.dia >= 1 && cf.dia <= 31)) return 'Dia do vencimento entre 1 e 31.';
  const v = vigOrdenadas(cf);
  if (!v.length) return 'Inclua pelo menos uma vigência.';
  for (const [i, x] of v.entries()) {
    if (!x.inicio) return `Vigência ${i + 1}: informe o início.`;
    if (x.fim && x.fim < x.inicio) return `Vigência ${i + 1}: o fim é antes do início.`;
    if (!(Number(x.valor) > 0)) return `Vigência ${i + 1}: informe um valor maior que zero.`;
    if (i < v.length - 1 && (!x.fim || x.fim >= v[i + 1].inicio)) return `As vigências ${fmtMes(x.inicio)} e ${fmtMes(v[i + 1].inicio)} se sobrepõem: termine a anterior antes do início da seguinte.`;
  }
  return null;
}
async function salvarCF(cf, novo) {
  const erro = validarCF(cf); if (erro) { toast(erro, true); return false; }
  cf.vigencias = vigOrdenadas(cf).map(v => ({ ...v, valor: r2(Number(v.valor)) }));
  await carregarCF();
  const i = S.cf.lista.findIndex(x => x.id === cf.id);
  if (i >= 0) S.cf.lista[i] = cf; else S.cf.lista.push(cf);
  try {
    const r = await sincronizarCF(cf);
    await gravarCF();
    toast(`${novo ? 'Custo fixo criado' : 'Vigências salvas'} · lançamentos: ${resumoSinc(r)}.`);
    return true;
  } catch (e) { toast(e.message, true); return false; }
}

async function viewFluxo() {
  const { ini, fim } = periodoMes();
  const pid = S.empresaVis === 'all' ? null : S.empresaVis;
  let lancs = [], saldo0 = 0;
  try { [lancs, saldo0] = await Promise.all([store.lancs({ ini, fim, planilha_id: pid }), store.saldoAte(pid, ini)]); }
  catch (e) { toast(e.message, true); }
  const nd = ultimoDia(S.ano, S.mes);
  const dias = Array.from({ length: nd }, (_, i) => ({ dia: i + 1, data: `${S.ano}-${pad(S.mes + 1)}-${pad(i + 1)}`, ent: 0, sai: 0, itens: [] }));
  for (const l of lancs) {
    const d = dias[Number(l.data_lancamento.slice(8, 10)) - 1]; if (!d) continue;
    const v = Number(l.valor);
    if (sinal(l) > 0) d.ent += v; else d.sai += v;
    d.itens.push(l);
  }
  let s = saldo0, menor = { v: Infinity, d: null };
  for (const d of dias) {
    d.ini = s; s = r2(s + d.ent - d.sai); d.fim = s;
    if (d.fim < menor.v) menor = { v: d.fim, d: d.dia };
  }
  S.fluxoDados = { dias, saldo0, saldoFim: s, menor, tEnt: dias.reduce((a, d) => a + d.ent, 0), tSai: dias.reduce((a, d) => a + d.sai, 0) };
  renderFluxo();
}

async function viewDRE() {
  const pid = S.empresaVis === 'all' ? null : S.empresaVis;
  let lancs = [];
  try { lancs = await store.lancs({ ini: `${S.ano}-01-01`, fim: `${S.ano}-12-31`, planilha_id: pid }); }
  catch (e) { toast(e.message, true); }
  const z = () => Array(12).fill(0);
  const pos = Object.fromEntries(DRE_POS.map(([k]) => [k, z()]));
  const conta = {}, semDre = z(), contasSem = new Set(), comDados = new Set();
  for (const l of lancs) {
    const m = Number(l.data_lancamento.slice(5, 7)) - 1, v = sinal(l) * Number(l.valor);
    const pc = M.plano[l.plano_conta_id], gd = M.gdre[pc?.grupo_dre_id];
    comDados.add(m);

  }
  S.dre.dados = { pos, conta, semDre, contasSem, comDados };
  renderDRE();
}

/* ============================ MARKUP DE VENDA ============================ */
// Mark-up (divisor) = 1 ÷ (1 − (impostos% + despesas fixas% + despesas com vendas% + despesas financeiras% + lucro%))
// Multiplicador = Mark-up − 1. Percentuais tirados da DRE, sobre a Receita Operacional Bruta de cada mês.
const MK_PADRAO = { lucro: 10, usado: 120, porMes: {}, ignorarAtual: true };
const chaveMarkup = () => `markup:${S.empresaVis}:${S.ano}`;
const CORM = { nec: '#2a78d6', usado: '#eb6834', real: '#1baf7a' };

async function viewMarkup() {
  const pid = S.empresaVis === 'all' ? null : S.empresaVis;
  let lancs = [], prm = null;
  try { lancs = await store.lancs({ ini: `${S.ano}-01-01`, fim: `${S.ano}-12-31`, planilha_id: pid }); } catch (e) { toast(e.message, true); }
  try { prm = await store.getParam(chaveMarkup()); } catch (e) { toast(e.message, true); }
  const z = () => Array(12).fill(0), pos = Object.fromEntries(DRE_POS.map(([k]) => [k, z()])), comDados = new Set();
  for (const l of lancs) {
    const m = Number(l.data_lancamento.slice(5, 7)) - 1, gd = M.gdre[M.plano[l.plano_conta_id]?.grupo_dre_id];
    comDados.add(m);
    if (gd) pos[gd.posicao][m] += sinal(l) * Number(l.valor);
  }
  S.mk = { prm: { ...MK_PADRAO, ...(prm || {}), porMes: { ...(prm?.porMes || {}) } }, pos, comDados };
  renderMarkup();
}

function calcMarkup() {
  const { prm, pos, comDados } = S.mk, L = prm.lucro / 100;
  const meses = Array.from({ length: 12 }, (_, m) => {
    const usado = (prm.porMes[m] ?? prm.usado) / 100, rob = pos.ROB[m];
    if (!comDados.has(m) || rob <= 0) return { m, dados: false, usado };
    const imp = -pos.IMP[m] / rob, fix = -pos.ADM[m] / rob, vend = -pos.DVV[m] / rob, fin = -pos.RFIN[m] / rob;
    const soma = imp + fix + vend + fin + L;
    const mk = soma < 1 ? 1 / (1 - soma) : NaN, mult = mk - 1;
    const custos = imp + fix + vend + fin;
    const lucroProj = 1 - 1 / (1 + usado) - custos;          // lucro se o preço = custo × (1 + multiplicador usado)
    const cmv = -(pos.CMV[m] + pos.VEST[m]);
    const real = cmv > 0 ? rob / cmv - 1 : NaN;              // multiplicador praticado: vendas ÷ custo das mercadorias − 1
    const parcial = S.ano === hoje.getFullYear() && m === hoje.getMonth();
    return { m, dados: true, parcial, imp, fix, vend, fin, lucro: L, soma, mk, mult, usado, dif: usado - mult, lucroProj, real };
  });
  const com = meses.filter(x => x.dados && !(x.parcial && prm.ignorarAtual));   // meses que entram na média
  const media = k => { const v = com.map(x => x[k]).filter(Number.isFinite); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : NaN; };
  const med = Object.fromEntries(['imp', 'fix', 'vend', 'fin', 'lucro', 'soma', 'mk', 'mult', 'dif', 'lucroProj', 'real'].map(k => [k, media(k)]));
  med.usado = meses.reduce((a, x) => a + x.usado, 0) / 12;
  return { meses, med, com };
}

function graficoMarkup(meses) {
  const com = meses.filter(x => x.dados);
  if (!com.length) return '';
  const W = largGraf(12), H = Math.round(Math.min(260, Math.max(200, W * 0.22))), L = 52, R = W < 560 ? 90 : 120, T = 14, B = 30;
  const series = [
    { k: 'mult', n: 'Necessário', c: CORM.nec },
    { k: 'usado', n: 'Usado', c: CORM.usado },
    { k: 'real', n: 'Praticado', c: CORM.real },
  ];
  const vals = com.flatMap(x => series.map(s => x[s.k] * 100)).filter(Number.isFinite);
  const sc = escala(Math.min(0, ...vals), Math.max(...vals));
  const x = m => L + (W - L - R) * (m + 0.5) / 12, y = v => T + (H - T - B) * (sc.hi - v) / (sc.hi - sc.lo);
  let g = '';
  for (let v = sc.lo; v <= sc.hi + sc.passo / 2; v += sc.passo)
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${Math.abs(v) < 1e-6 ? CORD.zero : CORD.grade}"/><text x="${L - 8}" y="${y(v) + 4}" font-size="12" fill="${CORD.mut}" text-anchor="end" ${FONTE}>${Math.round(v)}%</text>`;
  MESES.forEach((mm, m) => { g += `<text x="${x(m)}" y="${H - 9}" font-size="12" fill="${meses[m].dados ? CORD.txt : CORD.mut}" text-anchor="middle" ${FONTE}>${mm}</text>`; });
  const fins = [];
  for (const s of series) {
    const pts = com.filter(p => Number.isFinite(p[s.k])).map(p => [x(p.m), y(p[s.k] * 100)]);
    if (!pts.length) continue;
    g += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" ${s.k === 'usado' ? 'stroke-dasharray="7 5"' : ''}/>`;
    g += pts.map(([px, py]) => `<circle cx="${px}" cy="${py}" r="4.5" fill="${s.c}" stroke="#fff" stroke-width="2"/>`).join('');
    fins.push({ y: pts.at(-1)[1], x: pts.at(-1)[0], n: s.n, c: s.c });
  }
  // rótulos no fim das linhas, afastados para não encavalar
  fins.sort((a, b) => a.y - b.y);
  for (let i = 1; i < fins.length; i++) if (fins[i].y - fins[i - 1].y < 16) fins[i].y = fins[i - 1].y + 16;
  const xr = Math.max(...fins.map(f => f.x)) + 12;
  g += fins.map(f => `<rect x="${xr}" y="${f.y - 5}" width="10" height="10" rx="2" fill="${f.c}"/><text x="${xr + 15}" y="${f.y + 4}" font-size="12" fill="${CORD.txt}" font-weight="600" ${FONTE}>${f.n}</text>`).join('');
  g += meses.map(p => `<rect class="hit" x="${x(p.m) - (W - L - R) / 24}" y="${T}" width="${(W - L - R) / 12}" height="${H - T - B}" fill="transparent" tabindex="0" ${dt(`${MESES_NOME[p.m]} de ${S.ano}`,
    p.dados ? [[pct(p.mult), 'multiplicador necessário', CORM.nec], [pct(p.usado), 'multiplicador usado', CORM.usado], [pct(p.real), 'multiplicador praticado', CORM.real], [pct(p.lucroProj), 'lucro projetado com o usado', '']] : [[pct(p.usado), 'multiplicador usado', CORM.usado], ['sem vendas', 'no mês', '']])}/>`).join('');
  return `<section class="graf dcard s12" id="mkGraf">
    <div class="dhead"><div><div class="graf-t">Multiplicador mês a mês</div><div class="dsub">necessário para o lucro desejado × usado na formação de preço × praticado nas vendas (vendas ÷ CMV)</div></div></div>
    <div class="leg"><span><i style="background:${CORM.nec}"></i>Necessário</span><span><i style="background:${CORM.usado}"></i>Usado</span><span><i style="background:${CORM.real}"></i>Praticado</span></div>
    <svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Multiplicador necessário, usado e praticado por mês"><rect width="${W}" height="${H}" fill="#fff"/>${g}</svg>
    <div class="tip" hidden></div></section>`;
}

function renderMarkup() {
  const { prm } = S.mk, { meses, med, com } = calcMarkup();
  const pc = v => Number.isFinite(v) ? (Math.abs(v) < 5e-5 ? 0 : v * 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%' : '';
  const mk3 = v => Number.isFinite(v) ? v.toLocaleString('pt-BR', { minimumFractionDigits: 3, maximumFractionDigits: 3 }) : '';
  const cel = (x, k, f) => `<td class="${x.dados ? '' : 'fut'}">${x.dados ? f(x[k]) : ''}</td>`;

  const inviavel = com.some(x => !Number.isFinite(x.mk));
  const abaixo = Number.isFinite(med.mult) && med.usado < med.mult - 1e-9;

  const body = `
    <tr class="sec"><td class="l">PERCENTUAIS SOBRE A RECEITA (DRE)</td><td colspan="13"></td></tr>
    ${linha('Impostos (%)', 'imp', pc, '', 'Impostos ÷ Receita Operacional Bruta')}
    ${linha('Despesas fixas (%)', 'fix', pc, '', 'Despesas Administrativas ÷ Receita Operacional Bruta')}
    ${linha('Despesas com vendas (%)', 'vend', pc, '', 'Despesas Variáveis de Venda ÷ Receita Operacional Bruta')}
    ${linha('Despesas financeiras (%)', 'fin', pc, '', 'Resultado Financeiro (negativo) ÷ Receita Operacional Bruta')}
    <tr class="par"><td class="l">Lucro desejado (%)</td>${meses.map(x => `<td class="${x.dados ? '' : 'fut'}">${x.dados ? pc(x.lucro) : ''}</td>`).join('')}<td class="tot">${pc(prm.lucro / 100)}</td></tr>
    ${linha('Soma dos percentuais', 'soma', pc, 'sub')}
    <tr class="sec"><td class="l">MARKUP</td><td colspan="13"></td></tr>
    ${linha('Mark-up (divisor)', 'mk', mk3, 'mk', '1 ÷ (1 − soma dos percentuais)')}
    ${linha('Multiplicador necessário', 'mult', pc, 'nec', 'Mark-up − 1: quanto somar sobre o custo')}
    <tr class="usado"><td class="l">Multiplicador (markup) usado</td>${meses.map(x => `<td><input class="mk-in ${prm.porMes[x.m] != null ? 'proprio' : ''}" data-chg="mkMes" data-m="${x.m}" inputmode="decimal" value="${num2(x.usado * 100)}" title="${prm.porMes[x.m] != null ? 'Valor próprio deste mês' : 'Valor padrão'} · altere para este mês"></td>`).join('')}<td class="tot">${pc(med.usado)}</td></tr>

function atualizarSimulador() {
  const out = $('mkSimRes'); if (!out) return;
  const custo = parseValor($('mk_custo').value);
  const { meses, med } = calcMarkup();
  const base = S.mkBase == null || S.mkBase === 'media' ? med : meses[Number(S.mkBase)];
  if (!(custo > 0) || !base) { out.innerHTML = '<div class="mut sim-vazio">Digite um custo para simular.</div>'; return; }
  const pNec = custo * base.mk, pUs = custo * (1 + base.usado);
  out.innerHTML = `<div class="sim-res">
    <div><span>Preço para ${pct(S.mk.prm.lucro / 100)} de lucro</span><b>${Number.isFinite(pNec) ? brl(pNec) : '–'}</b><small>custo × ${base.mk?.toLocaleString('pt-BR', { maximumFractionDigits: 3 }) ?? '–'}</small></div>
    <div><span>Preço com o multiplicador usado</span><b>${brl(pUs)}</b><small>custo × ${(1 + base.usado).toLocaleString('pt-BR', { maximumFractionDigits: 3 })} · lucro ${pct(base.lucroProj)}</small></div>
    <div class="${pUs < pNec ? 'ruim' : 'bom'}"><span>Diferença por unidade</span><b>${brl(pUs - pNec)}</b><small>${pUs < pNec ? 'abaixo do preço ideal' : 'acima do preço ideal'}</small></div>
  </div>`;
}

// Cores validadas (dataviz): receitas = azul, despesas = laranja; cinza neutro só para totais.
const CORD = { rec: '#2a78d6', desp: '#eb6834', tot: '#58595e', grade: '#ececee', zero: '#9a9ba0', txt: '#2a2b2f', mut: '#74757b' };
const FONTE = `font-family="Segoe UI, Roboto, Arial, sans-serif"`;
const PERIODOS = [
  ['ano', 'Ano inteiro', 0, 11], ['s1', '1º semestre', 0, 5], ['s2', '2º semestre', 6, 11],
  ['t1', '1º trimestre', 0, 2], ['t2', '2º trimestre', 3, 5], ['t3', '3º trimestre', 6, 8], ['t4', '4º trimestre', 9, 11],
  ...MESES_NOME.map((n, i) => ['m' + i, n, i, i]),
];
function periodoDash() {
  const [k, rot, a, b] = PERIODOS.find(p => p[0] === S.dash.per) || PERIODOS[0];
  const len = b - a + 1;
  return {
    k, rot, a, b,
    ini: `${S.ano}-${pad(a + 1)}-01`, fim: `${S.ano}-${pad(b + 1)}-${pad(ultimoDia(S.ano, b))}`,
    pini: isoData(new Date(S.ano, a - len, 1)), pfim: isoData(new Date(S.ano, a, 0)),
    antRot: len === 12 ? `${S.ano - 1}` : len === 1 ? `${MESES_NOME[(a + 11) % 12]}` : 'período anterior',
  };
}
const valorCurto = v => {
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a >= 1e6) return s + (a / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
  if (a >= 1e3) return s + (a / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: a >= 1e5 ? 0 : 1 }) + ' mil';
  return s + Math.round(a).toLocaleString('pt-BR');
};
function escala(lo, hi, n = 4) {
  lo = Math.min(0, lo); hi = Math.max(0, hi);
  if (hi === lo) hi = lo + 1;
  const bruto = (hi - lo) / n, p10 = 10 ** Math.floor(Math.log10(bruto));
  const passo = [1, 2, 2.5, 5, 10].map(k => k * p10).find(k => k >= bruto);
  return { lo: Math.floor(lo / passo) * passo, hi: Math.ceil(hi / passo) * passo, passo };
}
// barra vertical com a ponta arredondada (a base fica reta, encostada no zero)
function barV(x, w, yb, yv, cor, extra = '') {
  const h = Math.abs(yb - yv); if (h < 0.5) return '';
  const r = Math.min(4, w / 2, h), up = yv < yb, d = up ? 1 : -1;
  return `<path d="M${x},${yb} V${yv + d * r} Q${x},${yv} ${x + r},${yv} H${x + w - r} Q${x + w},${yv} ${x + w},${yv + d * r} V${yb} Z" fill="${cor}" ${extra}/>`;
}
function barH(y, h, xb, xv, cor) {
  const w = Math.abs(xv - xb); if (w < 0.5) return '';
  const r = Math.min(4, h / 2, w), dir = xv > xb ? 1 : -1;
  return `<path d="M${xb},${y} H${xv - dir * r} Q${xv},${y} ${xv},${y + r} V${y + h - r} Q${xv},${y + h} ${xv - dir * r},${y + h} H${xb} Z" fill="${cor}"/>`;
}
const gradeY = (sc, y, L, R, W) => {
  let g = '';
  for (let v = sc.lo; v <= sc.hi + sc.passo / 2; v += sc.passo)
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${Math.abs(v) < 1e-6 ? CORD.zero : CORD.grade}" stroke-width="${Math.abs(v) < 1e-6 ? 1.2 : 1}"/>`
       + `<text x="${L - 8}" y="${y(v) + 4}" font-size="12" fill="${CORD.mut}" text-anchor="end" ${FONTE}>${valorCurto(v)}</text>`;
  return g;
};
// largura real do gráfico (em px) dentro do cartão: o texto do gráfico fica sempre em 11-12px, em qualquer tela
function largGraf(span) {
  const m = ($('main')?.clientWidth || innerWidth) - (innerWidth <= 760 ? 24 : 36);
  const duas = span === 6 && innerWidth > 1100;
  return Math.max(300, Math.round((duas ? (m - 14) / 2 : m) - 34));
}
let redimT, larguraAnt = innerWidth;
window.addEventListener('resize', () => {

function agregarDash(lancs, ini, fim) {
  const r = { rec: 0, desp: 0, grp: {}, conta: {}, pos: Object.fromEntries(DRE_POS.map(([k]) => [k, 0])), n: 0 };
  for (const l of lancs) {
    if (l.data_lancamento < ini || l.data_lancamento > fim) continue;
    const v = Number(l.valor), s = sinal(l), g = grupoDoPlano(l.plano_conta_id), gd = M.gdre[M.plano[l.plano_conta_id]?.grupo_dre_id];
    if (s > 0) r.rec += v; else r.desp += v;
    r.grp[g?.id ?? 0] = (r.grp[g?.id ?? 0] || 0) + v;
    r.conta[l.plano_conta_id] = (r.conta[l.plano_conta_id] || 0) + v;
    if (gd) r.pos[gd.posicao] += s * v;
    r.n++;
  }
  return r;
}

function renderDash() {
  const { lancs, saldo, saldosB, abertos = [], nBancos, P } = S.dash.dados;
  const at = agregarDash(lancs, P.ini, P.fim), an = agregarDash(lancs, P.pini, P.pfim);
  const res = at.rec - at.desp, resA = an.rec - an.desp;
  const margem = at.rec ? res / at.rec : NaN, margemA = an.rec ? resA / an.rec : NaN;
  const recM = Array(12).fill(0), despM = Array(12).fill(0);
  for (const l of lancs) {
    if (!l.data_lancamento.startsWith(String(S.ano))) continue;
    const m = Number(l.data_lancamento.slice(5, 7)) - 1;
    if (sinal(l) > 0) recM[m] += Number(l.valor); else despM[m] += Number(l.valor);
  }
  const noPer = m => m >= P.a && m <= P.b;

  // ---------- indicadores ----------
  const delta = (a, b, bomSobe, pp = false) => {
    if (!Number.isFinite(a) || !Number.isFinite(b) || (!pp && !b)) return `<div class="d">sem comparação</div>`;
    const v = pp ? (a - b) * 100 : (a - b) / Math.abs(b) * 100;
    if (Math.abs(v) < 0.05) return `<div class="d">= estável vs ${esc(P.antRot)}</div>`;
    const sobe = v > 0, bom = sobe === bomSobe;
    return `<div class="d ${bom ? 'bom' : 'ruim'}"><b>${sobe ? '▲' : '▼'} ${Math.abs(v).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}${pp ? ' p.p.' : '%'}</b> vs ${esc(P.antRot)} <span class="sr">${bom ? '(melhora)' : '(piora)'}</span></div>`;
  };
  // minigráfico de 12 meses (uma série; o ponto marca o último mês com movimento)
  const spark = (arr, cor) => {
    const W = 120, H = 34, ult = Math.max(...arr.map((v, i) => v ? i : -1));
    if (ult < 0) return '';
    const vs = arr.slice(0, ult + 1), lo = Math.min(0, ...vs), hi = Math.max(...vs, lo + 1);
    const x = i => 2 + (W - 6) * i / 11, y = v => 3 + (H - 6) * (hi - v) / (hi - lo);
    const pts = vs.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${x(0)},${y(0)} ${pts} ${x(ult)},${y(0)}" fill="${cor}" opacity=".10" stroke="none"/><polyline points="${pts}" fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(ult)}" cy="${y(vs[ult])}" r="3.5" fill="${cor}" stroke="#fff" stroke-width="1.5"/></svg>`;
  };
  const resM12 = recM.map((r, m) => r - despM[m]);
  const kpis = `<div class="kpis kpis-d">
    <div class="kp rec"><div class="l">Receitas</div><div class="v">${brl(at.rec)}</div>${delta(at.rec, an.rec, true)}${spark(recM, CORD.rec)}</div>
    <div class="kp desp"><div class="l">Despesas</div><div class="v">${brl(at.desp)}</div>${delta(at.desp, an.desp, false)}${spark(despM, CORD.desp)}</div>
    <div class="kp hero"><div class="l">Resultado</div><div class="v ${res < 0 ? 'neg' : ''}">${brl(res)}</div>${delta(res, resA, true)}${spark(resM12, '#f8a66d')}</div>
    <div class="kp"><div class="l">Margem líquida</div><div class="v ${margem < 0 ? 'neg' : ''}">${Number.isFinite(margem) ? pct(margem) : '–'}</div>${delta(margem, margemA, true, true)}
      <div class="barra-m"><i style="width:${Number.isFinite(margem) ? Math.max(0, Math.min(100, margem * 100)) : 0}%"></i></div></div>
    <div class="kp caixa"><div class="l">Saldo em bancos</div><div class="v ${saldo < 0 ? 'neg' : ''}">${brl(saldo)}</div><div class="d">em ${fmtData(P.fim)}${nBancos ? ` · ${nBancos} conta(s)` : ''}</div></div>
  </div>`;

  // ---------- contas em aberto (pagar / receber depois) ----------
  const abP = abertos.filter(l => sinal(l) < 0), abR = abertos.filter(l => sinal(l) > 0), venc = abertos.filter(l => situacao(l) === 'vencido');
  const somaV = a => a.reduce((x, l) => x + Number(l.valor), 0);
  const ate7 = abertos.filter(l => vencimento(l) >= HOJE && vencimento(l) <= addDias(HOJE, 7));
  const proximos = abertos.slice(0, 7);
  const cardAbertos = `<section class="graf dcard s12 ab-card">
    <div class="dhead"><div><div class="graf-t">Contas em aberto</div><div class="dsub">lançadas sem pagamento · vencidas e próximas</div></div>
      <button class="mini" data-act="view" data-v="lancamentos">Ver lançamentos →</button></div>
    <div class="ab-grid">
      <div class="ab-tot">
        <div class="abt desp" data-act="abLista" data-t="pagar" title="Ver as contas a pagar"><small>A pagar</small><b>${brl(somaV(abP))}</b><span>${abP.length} conta(s)</span></div>
        <div class="abt rec" data-act="abLista" data-t="receber" title="Ver as contas a receber"><small>A receber</small><b>${brl(somaV(abR))}</b><span>${abR.length} conta(s)</span></div>
        <div class="abt venc ${venc.length ? 'on' : ''}" data-act="abLista" data-t="venc" title="Ver as contas vencidas"><small>Vencidas</small><b>${brl(somaV(venc))}</b><span>${venc.length ? `${venc.length} conta(s) em atraso` : 'nada em atraso'}</span></div>
        <div class="abt" data-act="abLista" data-t="semana" title="Ver os vencimentos dos próximos 7 dias"><small>Próximos 7 dias</small><b>${brl(somaV(ate7))}</b><span>${ate7.length} vencimento(s)</span></div>
      </div>
      <div class="ab-lista">${proximos.length ? proximos.map(l => {
        const st = situacao(l), rec = sinal(l) > 0, dias = Math.round((new Date(vencimento(l) + 'T12:00') - new Date(HOJE + 'T12:00')) / 864e5);
        return `<div class="ab-l ${st}"><div class="ab-d"><b>${fmtData(vencimento(l)).slice(0, 5)}</b><small>${st === 'vencido' ? `${-dias} dia(s) atraso` : dias === 0 ? 'hoje' : `em ${dias} dia(s)`}</small></div>
          <div class="ab-n"><b>${esc(l.item || M.plano[l.plano_conta_id]?.nome || '')}</b><small>${esc(planoLabel(l.plano_conta_id))}${S.empresaVis === 'all' ? ' · ' + esc(siglaEmpresa(l.planilha_id)) : ''}</small></div>
          <b class="ab-v ${st === 'vencido' ? 'neg' : rec ? 'pos' : 'neg'}">${rec ? '+' : '−'} ${num2(l.valor)}</b>
          <button class="selo ${st} ${rec ? 'rec' : 'desp'}" data-act="pagar" data-id="${l.id}">${rec ? '↓ Receber' : '↑ Pagar'}</button></div>`;
      }).join('') : '<div class="ab-vazio">✓ Nenhuma conta em aberto. Lançamentos feitos sem banco aparecem aqui até serem pagos ou recebidos.</div>'}</div>
    </div><div class="tip" hidden></div></section>`;

  // ---------- 1. Receitas x despesas por mês ----------
  const g1 = (() => {
    const W = largGraf(12), H = Math.round(Math.min(250, Math.max(190, W * 0.2))), L = 58, R = 12, T = 12, B = 30;
    if (!recM.some(v => v) && !despM.some(v => v)) return semDados(W, H);
    const sc = escala(0, Math.max(...recM, ...despM)), y = v => T + (H - T - B) * (sc.hi - v) / (sc.hi - sc.lo);
    const gw = (W - L - R) / 12, bw = Math.min(28, gw * 0.32);
    let marcas = '', hits = '';
    for (let m = 0; m < 12; m++) {
      const cx = L + gw * (m + 0.5), op = noPer(m) ? '' : 'opacity="0.3"';
      marcas += barV(cx - bw - 1, bw, y(0), y(recM[m]), CORD.rec, op) + barV(cx + 1, bw, y(0), y(despM[m]), CORD.desp, op)
        + `<text x="${cx}" y="${H - 9}" font-size="12" fill="${noPer(m) ? CORD.txt : CORD.mut}" font-weight="${noPer(m) ? 700 : 400}" text-anchor="middle" ${FONTE}>${MESES[m]}</text>`;
      hits += `<rect class="hit" x="${L + gw * m}" y="${T}" width="${gw}" height="${H - T - B}" fill="transparent" tabindex="0" ${dt(`${MESES_NOME[m]} de ${S.ano}`, [[brl(recM[m]), 'receitas', CORD.rec], [brl(despM[m]), 'despesas', CORD.desp], [brl(recM[m] - despM[m]), 'resultado', '']])}/>`;
    }
    return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e despesas por mês"><rect width="${W}" height="${H}" fill="#fff"/>${gradeY(sc, y, L, R, W)}${marcas}${hits}</svg>`;
  })();
  const t1 = `<table class="zebra"><thead><tr><th>Mês</th><th>Receitas</th><th>Despesas</th><th>Resultado</th></tr></thead><tbody>${MESES_NOME.map((n, m) => `<tr><td>${n}</td><td class="r">${num2(recM[m])}</td><td class="r">${num2(despM[m])}</td><td class="r ${clsSinal(recM[m] - despM[m])}">${num2(recM[m] - despM[m])}</td></tr>`).join('')}</tbody></table>`;

  // ---------- 2. Do faturamento ao resultado (cascata da DRE) ----------
  const v = calcularLinhas({ ...at.pos });
  const passos = [['Receita bruta', v.ROB, 'tot'], ['Não operacionais', v.RNO], ['Impostos', v.IMP], ['CMV', v.CMV + v.VEST], ['Desp. variáveis', v.DVV], ['Margem contrib.', v.MC, 'tot'],
    ['Desp. ADM', v.ADM], ['EBITDA', v.EBITDA, 'tot'], ['Financeiro', v.RFIN], ['Dívidas', v.EMP + v.POS + v.CAPT], ['Geração de caixa', v.GER, 'tot']]
    .filter(([, val, t]) => t || Math.abs(val) > 0.5);
  const g2 = (() => {
    const W = largGraf(6), H = Math.round(Math.min(290, Math.max(230, W * 0.45))), L = 54, R = 10, T = 22, B = 46;
    if (!at.n) return semDados(W, H);
    let acc = 0; const barras = passos.map(([rot, val, t]) => { const de = t ? 0 : acc, ate = t ? val : acc + val; acc = t ? val : acc + val; return { rot, val, de, ate, t }; });
    const sc = escala(Math.min(...barras.flatMap(b => [b.de, b.ate])), Math.max(...barras.flatMap(b => [b.de, b.ate])));
    const y = q => T + (H - T - B) * (sc.hi - q) / (sc.hi - sc.lo), gw = (W - L - R) / barras.length, bw = Math.min(34, gw * 0.62);
    let s = gradeY(sc, y, L, R, W);
    barras.forEach((b, i) => {
      const x = L + gw * i + (gw - bw) / 2, cor = b.t ? CORD.tot : b.val >= 0 ? CORD.rec : CORD.desp;
      const top = Math.min(y(b.de), y(b.ate)), h = Math.max(1, Math.abs(y(b.de) - y(b.ate)));
      s += b.t ? barV(x, bw, y(0), y(b.ate), cor) : `<rect x="${x}" y="${top}" width="${bw}" height="${h}" rx="2" fill="${cor}"/>`;
      if (i < barras.length - 1) s += `<line x1="${x + bw}" x2="${x + gw}" y1="${y(b.ate)}" y2="${y(b.ate)}" stroke="${CORD.zero}" stroke-dasharray="2 2"/>`;
      const estreito = gw < 44, ly = b.val >= 0 || b.t ? top - 6 : top + h + 13;
      if (estreito && !b.t) { s += `<rect class="hit" x="${L + gw * i}" y="${T}" width="${gw}" height="${H - T - B}" fill="transparent" tabindex="0" ${dt(b.rot, [[brl(b.val), b.val >= 0 ? 'soma' : 'subtrai', b.val >= 0 ? CORD.rec : CORD.desp]])}/>`; return; }
      s += `<text x="${x + bw / 2}" y="${ly}" font-size="11" font-weight="${b.t ? 700 : 400}" fill="${CORD.txt}" text-anchor="middle" ${FONTE}>${valorCurto(b.val)}</text>`;
      const pal = b.rot.split(' ');
      s += `<text x="${x + bw / 2}" y="${H - 28}" font-size="11" fill="${CORD.mut}" text-anchor="middle" ${FONTE}>${esc(pal[0])}</text>` + (pal[1] ? `<text x="${x + bw / 2}" y="${H - 14}" font-size="11" fill="${CORD.mut}" text-anchor="middle" ${FONTE}>${esc(pal.slice(1).join(' '))}</text>` : '');
      s += `<rect class="hit" x="${L + gw * i}" y="${T}" width="${gw}" height="${H - T - B}" fill="transparent" tabindex="0" ${dt(b.rot, [[brl(b.val), b.t ? 'subtotal' : b.val >= 0 ? 'soma' : 'subtrai', b.t ? CORD.tot : b.val >= 0 ? CORD.rec : CORD.desp], ...(v.ROB ? [[pct(b.val / v.ROB), 'da receita bruta', '']] : [])])}/>`;
    });
    return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cascata do faturamento ao resultado">${`<rect width="${W}" height="${H}" fill="#fff"/>`}${s}</svg>`;
  })();
  const t2 = `<table class="zebra"><thead><tr><th>Etapa</th><th>Valor</th><th>% receita bruta</th></tr></thead><tbody>${passos.map(([r, val, t]) => `<tr><td>${t ? `<b>${esc(r)}</b>` : esc(r)}</td><td class="r ${clsSinal(val)}">${num2(val)}</td><td class="r">${v.ROB ? pct(val / v.ROB) : '–'}</td></tr>`).join('')}</tbody></table>`;

  // ---------- 3. Resultado mensal ----------
  const resM = recM.map((r, m) => r - despM[m]);
  const g3 = (() => {
    const W = largGraf(6), H = Math.round(Math.min(290, Math.max(220, W * 0.45))), L = 54, R = 10, T = 14, B = 30;
    if (!resM.some(x => x)) return semDados(W, H);
    const sc = escala(Math.min(...resM), Math.max(...resM)), y = q => T + (H - T - B) * (sc.hi - q) / (sc.hi - sc.lo);
    const gw = (W - L - R) / 12, bw = Math.min(26, gw * 0.6);
    let s = gradeY(sc, y, L, R, W);
    resM.forEach((r, m) => {
      const x = L + gw * m + (gw - bw) / 2, op = noPer(m) ? '' : 'opacity="0.3"';
      s += barV(x, bw, y(0), y(r), r >= 0 ? CORD.rec : CORD.desp, op)
        + `<text x="${x + bw / 2}" y="${H - 9}" font-size="11" fill="${noPer(m) ? CORD.txt : CORD.mut}" font-weight="${noPer(m) ? 700 : 400}" text-anchor="middle" ${FONTE}>${MESES[m]}</text>`
        + `<rect class="hit" x="${L + gw * m}" y="${T}" width="${gw}" height="${H - T - B}" fill="transparent" tabindex="0" ${dt(`${MESES_NOME[m]} de ${S.ano}`, [[brl(r), r >= 0 ? 'lucro' : 'prejuízo', r >= 0 ? CORD.rec : CORD.desp], [recM[m] ? pct(r / recM[m]) : '–', 'margem', '']])}/>`;
    });
    return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Resultado mensal">${`<rect width="${W}" height="${H}" fill="#fff"/>`}${s}</svg>`;
  })();
  const t3 = `<table class="zebra"><thead><tr><th>Mês</th><th>Resultado</th><th>Margem</th></tr></thead><tbody>${resM.map((r, m) => `<tr><td>${MESES_NOME[m]}</td><td class="r ${clsSinal(r)}">${num2(r)}</td><td class="r">${recM[m] ? pct(r / recM[m]) : '–'}</td></tr>`).join('')}</tbody></table>`;

  // ---------- barras horizontais ordenadas ----------
  const ranking = (itens, cor, total, rotTot, comLogo = false) => {
    const W = largGraf(6), LBL = W < 520 ? (comLogo ? 140 : 130) : W > 900 ? 300 : comLogo ? 200 : 230, R = W < 520 ? 92 : 112, rowH = 28, T = 6;
    if (!itens.length) return semDados(W, 200);
    const H = T + itens.length * rowH + 6, maxV = Math.max(...itens.map(i => Math.abs(i.v))), minV = Math.min(0, ...itens.map(i => i.v));
    const x0 = LBL + (minV < 0 ? (W - LBL - R) * (-minV) / (maxV - minV) : 0), sx = q => x0 + (W - LBL - R) * q / (maxV - minV || 1);
    let s = minV < 0 ? `<line x1="${x0}" x2="${x0}" y1="${T}" y2="${H - 6}" stroke="${CORD.zero}"/>` : '';
    itens.forEach((it, i) => {
      const yy = T + i * rowH, c = typeof cor === 'function' ? cor(it.v) : cor, mx = Math.floor((LBL - (comLogo ? 30 : 6)) / 6.6), nome = it.n.length > mx ? it.n.slice(0, mx - 1) + '…' : it.n;
      if (comLogo && it.logo) s += `<image href="${it.logo}" x="0" y="${yy + 6}" width="18" height="18"/>`;
      s += `<text x="${comLogo ? 24 : 0}" y="${yy + 19}" font-size="12" fill="${CORD.txt}" ${FONTE}>${esc(nome)}</text>`
        + barH(yy + 7, 16, sx(0), sx(it.v), c)
        + `<text x="${Math.max(sx(it.v), x0) + 6}" y="${yy + 19}" font-size="12" font-weight="700" fill="${CORD.txt}" ${FONTE}>${valorCurto(it.v)}${total ? `<tspan font-weight="400" fill="${CORD.mut}">  ${pct(it.v / total)}</tspan>` : ''}</text>`
        + `<rect class="hit" x="0" y="${yy}" width="${W}" height="${rowH}" fill="transparent" tabindex="0" ${dt(it.n, [[brl(it.v), rotTot, c], ...(total ? [[pct(it.v / total), 'do total', '']] : [])])}/>`;
    });
    return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img"><rect width="${W}" height="${H}" fill="#fff"/>${s}</svg>`;
  };
  const tabRank = (itens, cab, total) => `<table class="zebra"><thead><tr><th>${cab}</th><th>Valor</th>${total ? '<th>%</th>' : ''}</tr></thead><tbody>${itens.map(i => `<tr><td>${esc(i.n)}</td><td class="r ${i.v < 0 ? 'neg' : ''}">${num2(i.v)}</td>${total ? `<td class="r">${pct(i.v / total)}</td>` : ''}</tr>`).join('')}</tbody></table>`;
  const topN = (arr, n) => { const o = [...arr].sort((a, b) => b.v - a.v); if (o.length <= n) return o; const resto = o.slice(n - 1).reduce((a, i) => a + i.v, 0); return [...o.slice(0, n - 1), { n: `Outros (${o.length - n + 1})`, v: resto }]; };
  const despGrp = topN(S.grupos.filter(g => g.tipo === 'DESPESA' && at.grp[g.id]).map(g => ({ n: g.nome, v: at.grp[g.id] })), 8);
  const despConta = topN(S.plano_contas.filter(p => grupoDoPlano(p.id)?.tipo === 'DESPESA' && at.conta[p.id]).map(p => ({ n: `${p.codigo} ${p.nome}`, v: at.conta[p.id] })), 10);
  const recGrp = topN(S.grupos.filter(g => g.tipo === 'RECEITA' && at.grp[g.id]).map(g => ({ n: g.nome, v: at.grp[g.id] })), 6);
  const bancos = (bancosSoDaEmpresa(S.empresaVis).length ? bancosSoDaEmpresa(S.empresaVis) : S.bancos).map(b => ({ n: b.nome, v: saldosB[b.id] || 0, logo: logoBanco(b) })).sort((a, b) => b.v - a.v);

  $('main').innerHTML = `
    <div class="dash-hero" style="--ec:${esc(corEmpresa(S.empresaVis))}">
      <div class="dh-t">
        <small>Painel financeiro · ${esc(P.rot)} de ${S.ano}</small>
        <h2>${esc(nomeNaTela(S.empresaVis, 'DASHBOARD'))}</h2>
        <p>Comparado com ${esc(P.antRot)} · passe o mouse nos gráficos para ver os valores${S.empresaVis === 'all' ? ` · ${esc(S.planilhas.map(p => siglaEmpresa(p.id)).join(' + '))}` : ''}</p>
      </div>
      <div class="dh-f">
        ${barraAno()}
        <select class="dper" data-chg="dashPer">${PERIODOS.map(([k, r], i) => `${i === 7 ? '<optgroup label="Mês">' : ''}<option value="${k}" ${k === P.k ? 'selected' : ''}>${r}</option>`).join('')}</optgroup></select>
      </div>
    </div>
    <div class="barra">${abasEmpresa(S.empresaVis, 'empresaVis', true, 'DASHBOARD')}</div>
    ${kpis}
    <div class="dgrid">
      ${cardAbertos}
      ${cartao('d1', 'Receitas x Despesas por mês', `${S.ano} · meses fora do período aparecem esmaecidos`, g1, t1, 12, legendaRD)}
      ${cartao('d2', 'Do faturamento ao resultado', `${esc(P.rot)} · quanto cada etapa da DRE soma ou tira`, g2, t2, 6, `<div class="leg"><span><i style="background:${CORD.tot}"></i>Subtotal</span><span><i style="background:${CORD.rec}"></i>Soma</span><span><i style="background:${CORD.desp}"></i>Subtrai</span></div>`)}
      ${cartao('d3', 'Resultado mensal', `${S.ano} · lucro ou prejuízo de cada mês`, g3, t3, 6, `<div class="leg"><span><i style="background:${CORD.rec}"></i>Lucro</span><span><i style="background:${CORD.desp}"></i>Prejuízo</span></div>`)}
      ${cartao('d4', 'Despesas por grupo', `${esc(P.rot)} · total ${brl(at.desp)}`, ranking(despGrp, CORD.desp, at.desp, 'despesas'), tabRank(despGrp, 'Grupo', at.desp), 6)}
      ${cartao('d5', 'Maiores contas de despesa', `${esc(P.rot)} · 10 maiores`, ranking(despConta, CORD.desp, at.desp, 'despesas'), tabRank(despConta, 'Conta', at.desp), 6)}
      ${cartao('d6', 'Receitas por grupo', `${esc(P.rot)} · total ${brl(at.rec)}`, ranking(recGrp, CORD.rec, at.rec, 'receitas'), tabRank(recGrp, 'Grupo', at.rec), 6)}
      ${cartao('d7', 'Saldo por banco', `em ${fmtData(P.fim)} · ${S.empresaVis === 'all' || !bancosSoDaEmpresa(S.empresaVis).length ? 'todas as contas' : 'contas de ' + esc(siglaEmpresa(S.empresaVis))}, inclui transferências`, ranking(bancos, q => q >= 0 ? CORD.rec : CORD.desp, 0, 'saldo', true), tabRank(bancos, 'Banco', 0), 6)}
    </div>`;
}

function dicaDash(alvo, ev) {
  const card = alvo?.closest('.dcard'); if (!card) return;
  const tip = card.querySelector('.tip');
  tip.replaceChildren();
  const t = document.createElement('div'); t.className = 'tt'; t.textContent = alvo.dataset.tt; tip.append(t);
  for (const [val, rot, cor] of JSON.parse(alvo.dataset.tv || '[]')) {
    const d = document.createElement('div');
    if (cor) { const i = document.createElement('i'); i.className = 'sw'; i.style.background = cor; d.append(i); }
    const b = document.createElement('b'); b.textContent = val; if (val.startsWith('-')) b.className = 'neg';
    d.append(b, document.createTextNode(' ' + rot)); tip.append(d);
  }
  tip.hidden = false;
  const box = card.getBoundingClientRect(), r = alvo.getBoundingClientRect();
  const px = ev?.clientX ?? (r.left + r.width / 2), py = ev?.clientY ?? (r.top + r.height / 2);
  let left = px - box.left + 16, top = py - box.top + 16;
  if (left + tip.offsetWidth > box.width - 6) left = px - box.left - tip.offsetWidth - 16;
  if (top + tip.offsetHeight > box.height - 6) top = py - box.top - tip.offsetHeight - 12;
  tip.style.left = `${Math.max(6, left)}px`; tip.style.top = `${Math.max(6, top)}px`;
  card.querySelectorAll('.hit.on').forEach(h => h !== alvo && h.classList.remove('on')); alvo.classList.add('on');
}
function esconderDicaDash(card) { if (!card) return; card.querySelector('.tip').hidden = true; card.querySelectorAll('.hit.on').forEach(h => h.classList.remove('on')); }

/* ======================= FLUXO DE CAIXA ACUMULADO ======================= */
// Visão anual mês a mês: saldo inicial, entradas e saídas por grupo, resultado e saldo acumulado.
// Caixa inicial = saldo, na data, dos bancos ligados à empresa (Consolidado = todos os bancos).
// Se a empresa ainda não tem nenhum banco ligado, usa o saldo inicial do cadastro da empresa.
async function caixaInicial(pid, data) {
  const bs = bancosSoDaEmpresa(pid);
  if (pid != null && !bs.length) return { valor: await store.saldoAte(pid, data), bancos: [], fonte: 'empresa' };
  const saldos = await store.saldosBancos(data);
  const bancos = bs.map(b => ({ b, v: r2(Number(saldos[b.id]) || 0) }));
  return { valor: r2(bancos.reduce((a, x) => a + x.v, 0)), bancos, fonte: 'bancos' };
}

async function viewFluxoAcum() {
  const pid = S.empresaVis === 'all' ? null : S.empresaVis;
  let lancs = [], s0 = 0, cx = { valor: 0, bancos: [], fonte: 'bancos' };
  try { [lancs, cx] = await Promise.all([store.lancs({ ini: `${S.ano}-01-01`, fim: `${S.ano}-12-31`, planilha_id: pid }), caixaInicial(pid, `${S.ano}-01-01`)]); s0 = cx.valor; }
  catch (e) { toast(e.message, true); }
  const z = () => Array(12).fill(0);
  const grp = {}, conta = {}, ent = z(), sai = z(), comDados = new Set();
  for (const l of lancs) {
    const m = Number(l.data_lancamento.slice(5, 7)) - 1, v = Number(l.valor), g = grupoDoPlano(l.plano_conta_id);
    comDados.add(m);
    (grp[g?.id ?? 0] ||= z())[m] += v;
    (conta[l.plano_conta_id] ||= z())[m] += v;
    if (sinal(l) > 0) ent[m] += v; else sai[m] += v;
  }
  const ini = z(), fim = z();
  let s = s0;
  for (let m = 0; m < 12; m++) { ini[m] = s; s = r2(s + ent[m] - sai[m]); fim[m] = s; }
  S.fa = { ...(S.fa || {}), grp, conta, ent, sai, ini, fim, s0, cx, comDados, abertos: S.fa?.abertos || new Set() };
  renderFluxoAcum();
}

function graficoSaldo(fim, ultimo) {
  // uma série só (saldo acumulado), um eixo; dica com os valores ao passar o mouse
  const meses = [...Array(ultimo + 1).keys()];
  if (!meses.length) return '';
  const W = 1000, H = 230, L = 78, R = 16, T = 16, B = 30;
  const vals = meses.map(m => fim[m]);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi === lo) hi = lo + 1;
  const passo = (() => { const bruto = (hi - lo) / 4, p10 = 10 ** Math.floor(Math.log10(bruto)); return [1, 2, 2.5, 5, 10].map(k => k * p10).find(k => k >= bruto); })();
  lo = Math.floor(lo / passo) * passo; hi = Math.ceil(hi / passo) * passo;
  const x = m => L + (W - L - R) * (m + 0.5) / 12, y = v => T + (H - T - B) * (hi - v) / (hi - lo);
  const curto = v => { const a = Math.abs(v); return (v < 0 ? '-' : '') + (a >= 1e6 ? (a / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi' : a >= 1e3 ? Math.round(a / 1e3) + ' mil' : Math.round(a)); };
  let grade = '';
  for (let v = lo; v <= hi + passo / 2; v += passo) grade += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="${Math.abs(v) < 1e-6 ? 'zero' : 'gl'}"/><text x="${L - 8}" y="${y(v) + 4}" class="ax" text-anchor="end">${curto(v)}</text>`;
  const pts = meses.map(m => `${x(m)},${y(fim[m])}`).join(' ');
  const area = `${x(0)},${y(Math.max(lo, 0))} ${pts} ${x(ultimo)},${y(Math.max(lo, 0))}`;
  return `<div class="graf" id="grafSaldo">
    <div class="graf-t">Saldo acumulado mês a mês <span class="mut">· passe o mouse sobre os meses</span></div>
    <svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo acumulado mês a mês em ${S.ano}">
      <rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff"/>
      ${grade}
      ${MESES.map((mm, m) => `<text x="${x(m)}" y="${H - 9}" class="ax" text-anchor="middle">${mm}</text>`).join('')}
      <polygon points="${area}" class="area"/>
      <polyline points="${pts}" class="linha"/>

async function viewBancos() {
  if (S.bk.aba === 'fluxo') return viewBkFluxo();
  const B = S.bk;
  if (!B.ini) { const p = periodoMes(); B.ini = p.ini; B.fim = p.fim; }
  let saldos = {}, lancs = [], transfs = [];
  try { [saldos, lancs, transfs] = await Promise.all([store.saldosBancos(B.ini), store.lancs({ ini: B.ini, fim: B.fim }), store.transfs({ ini: B.ini, fim: B.fim })]); }
  catch (e) { toast(e.message, true); }
  const mv = Object.fromEntries(S.bancos.map(b => [b.id, { ent: 0, sai: 0 }]));
  const movs = [];
  for (const l of lancs) {
    if (!pagoNoBanco(l)) continue;                     // em aberto: ainda não passou por nenhum banco
    const v = sinal(l) * Number(l.valor);
    if (mv[l.banco_id]) mv[l.banco_id][v > 0 ? 'ent' : 'sai'] += Math.abs(v);
    movs.push({ data: l.data_lancamento, ord: l.id, banco: l.banco_id, emp: l.planilha_id, desc: l.item, conta: planoLabel(l.plano_conta_id), valor: v, tipo: v > 0 ? 'E' : 'S', aj: !!(l.ajustes && Object.keys(l.ajustes).length) });
  }
  for (const t of transfs) {
    const v = Number(t.valor), aj = !!(t.ajustes && Object.keys(t.ajustes).length);
    if (mv[t.banco_origem_id]) mv[t.banco_origem_id].sai += v;
    if (mv[t.banco_destino_id]) mv[t.banco_destino_id].ent += v;
    movs.push({ data: t.data, ord: t.id + 1e9, banco: t.banco_origem_id, emp: null, desc: `${t.descricao || 'Transferência'} → ${M.banco[t.banco_destino_id]?.nome ?? ''}`, conta: 'TRANSFERÊNCIA ENVIADA', valor: -v, tipo: 'T', aj });
    movs.push({ data: t.data, ord: t.id + 1e9 + .5, banco: t.banco_destino_id, emp: null, desc: `${t.descricao || 'Transferência'} ← ${M.banco[t.banco_origem_id]?.nome ?? ''}`, conta: 'TRANSFERÊNCIA RECEBIDA', valor: v, tipo: 'T', aj });
  }
  movs.sort((a, b) => a.data.localeCompare(b.data) || a.ord - b.ord);
  const tot = { ini: 0, ent: 0, sai: 0 };
  for (const b of S.bancos) { tot.ini += saldos[b.id] || 0; tot.ent += mv[b.id].ent; tot.sai += mv[b.id].sai; }
  S.bk.dados = { saldos, mv, movs, tot };
  if (B.sel !== 'all') { S.bk.fx = { ...(S.bk.fx || {}), vis: 'b:' + B.sel, mes: B.ini.slice(0, 7) }; await carregarBkFluxo(); }
  renderBancos();
}

// Visão: todos os bancos, os bancos de uma empresa ou um banco. Só entra o que passou pelo banco (pago/recebido).
const visBk = v => v.startsWith('e:') ? { pid: Number(v.slice(2)), banco: null, rot: siglaEmpresa(Number(v.slice(2))), cor: corEmpresa(Number(v.slice(2))) }
  : v.startsWith('b:') ? { pid: null, banco: Number(v.slice(2)), rot: M.banco[Number(v.slice(2))]?.nome ?? '', cor: corEmpresa(M.banco[Number(v.slice(2))]?.planilha_id ?? 'all') }
  : { pid: null, banco: null, rot: 'Todos os bancos', cor: '#2f3034' };
async function viewBkFluxo() {
  await carregarBkFluxo();
  if (S.bk.aba === 'fluxo') renderBancosShell(renderBkFluxo()); else renderBancos();
}
async function carregarBkFluxo() {
  const F = S.bk.fx ||= { vis: S.planilhaId ? 'e:' + S.planilhaId : 'all', mes: `${hoje.getFullYear()}-${pad(hoje.getMonth() + 1)}` };
  const [a, m] = F.mes.split('-').map(Number), ini = `${F.mes}-01`, fim = `${F.mes}-${pad(ultimoDia(a, m - 1))}`, V = visBk(F.vis);
  let lancs = [];
  try { lancs = await store.lancs({ ini, fim, planilha_id: V.pid, banco_id: V.banco }); } catch (e) { toast(e.message, true); }
  const dias = Array.from({ length: ultimoDia(a, m - 1) }, (_, i) => ({ dia: i + 1, data: `${F.mes}-${pad(i + 1)}`, rec: 0, desp: 0, n: 0 }));
  for (const l of lancs) {
    if (!pagoNoBanco(l)) continue;
    const d = dias[Number(l.data_lancamento.slice(8, 10)) - 1]; if (!d) continue;
    sinal(l) > 0 ? d.rec += Number(l.valor) : d.desp += Number(l.valor); d.n++;
  }
  S.bk.fxDados = { dias, ini, fim, V, a, m };
}
// embutido = aparece no "Saldos e extrato" ao clicar num banco (o banco vem do cartão clicado)

function exportarCSV() {
  const { linhas, saldoAnt, filtrado } = S.bk.export || {};
  if (!linhas) return;
  const n = v => num2(v).replace(/\./g, '');
  const rows = [['Data', 'Banco', 'Empresa', 'Descrição', 'Conta', 'Entrada', 'Saída', ...(filtrado ? [] : ['Saldo'])]];
  if (!filtrado) rows.push([fmtData(S.bk.ini), '', '', 'Saldo anterior', '', '', '', n(saldoAnt)]);
  for (const m of linhas) rows.push([fmtData(m.data), M.banco[m.banco]?.nome ?? '', m.emp ? M.planilha[m.emp]?.nome ?? '' : 'TRANSFERÊNCIA', m.desc ?? '', m.conta, m.valor > 0 ? n(m.valor) : '', m.valor < 0 ? n(-m.valor) : '', ...(filtrado ? [] : [n(m.saldo)])]);
  const csv = '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `extrato_${S.bk.ini}_${S.bk.fim}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function carregarSaldosTr() {
  if (!TRF) return;
  const data = valCampo('tf_data');

  if (!data) return;
  let s = {};

  if (o && o.data <= data) { s = { ...s }; s[o.banco_origem_id] = r2((s[o.banco_origem_id] || 0) + Number(o.valor)); s[o.banco_destino_id] = r2((s[o.banco_destino_id] || 0) - Number(o.valor)); }
  if (TRF && valCampo('tf_data') === data) { TRF.saldos = s; atualizarTr(); }
}
function atualizarTr() {
  if (!TRF || !$('tf_origem')) return;
  const o = Number(valCampo('tf_origem')) || null, d = Number(valCampo('tf_destino')) || null;
  const v = parseValor(valCampo('tf_valor')), val = v > 0 ? v : 0, data = valCampo('tf_data');
  const S0 = TRF.saldos, quando = data ? fmtData(data).slice(0, 5) : '';
  const caixa = (id, sinalV) => {
    if (!id) return '<span class="mut">Escolha uma conta para ver o saldo.</span>';
    if (!S0) return '<span class="mut">Calculando saldo…</span>';
    const a = S0[id] || 0, b = r2(a + sinalV * val);
    return `<div><small>Saldo em ${quando}</small><b class="${a < 0 ? 'neg' : ''}">${brl(a)}</b></div>
      <span class="tr-seta">→</span>
      <div><small>Depois</small><b class="${b < 0 ? 'neg' : sinalV > 0 && val ? 'pos' : ''}">${brl(b)}</b></div>`;
  };
  $('tf_so').innerHTML = caixa(o, -1); $('tf_sd').innerHTML = caixa(d, 1);
  for (const [cx, id] of [['tf_cs', o], ['tf_cd', d]]) $(cx).style.setProperty('--ec', id && M.banco[id]?.planilha_id ? corEmpresa(M.banco[id].planilha_id) : 'transparent');
  const av = [];
  if (o && d && o === d) av.push(['erro', 'A conta de origem e a de destino precisam ser diferentes.']);
  else {
    if (o && S0 && val && (S0[o] || 0) - val < -0.004) av.push(['alerta', `A conta de origem ficará negativa (${brl((S0[o] || 0) - val)}).`]);
    const po = M.banco[o]?.planilha_id, pd = M.banco[d]?.planilha_id;
    if (po && pd && po !== pd) av.push(['info', `Transferência entre empresas: <b>${esc(siglaEmpresa(po))} → ${esc(siglaEmpresa(pd))}</b>.`]);
  }
  $('tf_aviso').innerHTML = av.map(([c, t]) => `<div class="tr-av ${c}">${t}</div>`).join('');
  const ok = $('tf_ok');
  if (ok) { ok.textContent = TRF.id ? 'Salvar alteração' : val ? `Transferir ${brl(val)}` : 'Transferir'; ok.disabled = !!(o && d && o === d); }
}
function trocarTr() {
  const so = $('tf_origem'), sd = $('tf_destino'); if (!so || !sd) return;
  const a = so.value; so.value = sd.value; sd.value = a;
  $('tf_cs').parentElement.classList.remove('girou'); void so.offsetWidth; $('tf_cs').parentElement.classList.add('girou');
  atualizarTr();
}
async function salvarTr(mais = false) {
  if (!TRF) return;
  const row = {
    data: valCampo('tf_data'),
    banco_origem_id: Number(valCampo('tf_origem')) || null,
    banco_destino_id: Number(valCampo('tf_destino')) || null,
    descricao: valCampo('tf_desc').trim(),
    valor: parseValor(valCampo('tf_valor')),
  };
  if (!row.banco_origem_id) return toast('Escolha a conta de onde o dinheiro sai.', true), abrirBsel($('tf_origem'));
  if (!row.banco_destino_id) return toast('Escolha a conta para onde o dinheiro vai.', true), abrirBsel($('tf_destino'));
  if (row.banco_origem_id === row.banco_destino_id) return toast('Origem e destino precisam ser contas diferentes.', true);
  if (!(row.valor > 0)) return toast('Informe um valor maior que zero.', true), $('tf_valor').focus();
  if (!row.data) return toast('Informe a data.', true), $('tf_data').focus();
  const editando = !!TRF.id;
  try {
    if (editando) await store.update('transferencias', TRF.id, comAjuste(TRF.orig, row));
    else await store.insert('transferencias', row);
  } catch (e) { return toast(e.message, true); }
  const [a, m] = row.data.split('-').map(Number), fora = a !== S.ano || m - 1 !== S.mes;
  const txt = `${M.banco[row.banco_origem_id]?.nome} → ${M.banco[row.banco_destino_id]?.nome}`;
  toast(editando ? 'Transferência ajustada.' : `Transferência de ${brl(row.valor)} registrada (${txt})${fora ? ` em ${MESES_NOME[m - 1]}/${a}` : ''}.`);
  if (mais && !editando) {
    await viewTransferencias();
    if (!TRF) return;
    $('tf_valor').value = ''; $('tf_desc').value = '';
    await carregarSaldosTr(); $('tf_valor').focus();
    return;
  }
  fecharModal(true); TRF = null;
  await viewTransferencias();
}
async function excluirTr() {
  const t = TRF?.orig; if (!t) return;
  if (!confirm(`Excluir a transferência de ${brl(t.valor)}?`)) return;
  try { await store.remove('transferencias', t.id); } catch (e) { return toast(e.message, true); }
  fecharModal(true); TRF = null; toast('Transferência excluída.');
  await viewTransferencias();
}

async function salvarTransf() {
  const row = {
    data: valCampo('t_data'),
    banco_origem_id: Number(valCampo('t_origem')) || null,
    banco_destino_id: Number(valCampo('t_destino')) || null,
    descricao: valCampo('t_desc').trim(),
    valor: parseValor(valCampo('t_valor')),
  };
  if (!$('t_desc')) delete row.descricao;
  if (!row.data) return toast('Informe a data.', true);
  if (!row.banco_origem_id || !row.banco_destino_id) return toast('Escolha a conta de origem e a de destino.', true);
  if (row.banco_origem_id === row.banco_destino_id) return toast('Origem e destino precisam ser contas diferentes.', true);
  if (!(row.valor > 0)) return toast('Informe um valor maior que zero.', true), $('t_valor').focus();
  try {
    if (S.trEdit) await store.update('transferencias', S.trEdit, comAjuste(S.trLista.find(t => t.id === S.trEdit), row));
    else await store.insert('transferencias', row);
    toast(S.trEdit ? 'Transferência ajustada.' : `Transferência de ${brl(row.valor)} registrada.`);
    S.trEdit = null; await viewTransferencias(); $('t_origem').focus();
  } catch (e) { toast(e.message, true); }
}

});
const IMP_MAP_KEY = 'cap_import_map_v1';
let IMP = null;
const normTxt = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
const impMemo = () => { try { return JSON.parse(localStorage.getItem(IMP_MAP_KEY)) || { banco: {}, plano: {} }; } catch (e) { return { banco: {}, plano: {} }; } };
const impMemoSalvar = m => { try { localStorage.setItem(IMP_MAP_KEY, JSON.stringify(m)); } catch (e) {} };

function impData(v) {
  if (v == null || v === '') return null;
  let iso = null, m;
  if (typeof v === 'number') { if (v > 20000 && v < 80000) iso = new Date(Math.round((v - 25569) * 86400000)).toISOString().slice(0, 10); }
  else if (v instanceof Date) { if (!isNaN(v)) iso = isoData(v); }
  else {
    const s = String(v).trim();
    if ((m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))) { let a = Number(m[3]); if (a < 100) a += 2000; iso = `${a}-${pad(m[2])}-${pad(m[1])}`; }
    else if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) iso = `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  }
  if (!iso) return null;
  const [a, mm, d] = iso.split('-').map(Number);
  return mm >= 1 && mm <= 12 && d >= 1 && d <= ultimoDia(a, mm - 1) ? iso : null;
}
function impValor(v) {
  if (v == null || v === '') return null;
  const n = typeof v === 'number' ? r2(v) : parseValor(String(v).replace(/^\((.*)\)$/, '-$1'));
  return Number.isFinite(n) && Math.abs(n) >= 0.005 ? r2(Math.abs(n)) : null;
}

// colunas pelo título (a ordem pode variar); sem títulos reconhecidos, usa a ordem padrão da planilha
const IMP_COLS = [
  ['pag', /DATA (DE |DO )?PAGAMENTO|PAGO EM|DATA PAGTO/],
  ['prog', /PROGRAMADA|VENCIMENTO/],
  ['data', /DATA (DO |DE )?LANCAMENTO|^DATA$/],
  ['banco', /TIPO PAGAMENTO|BANCO|CONTA BANCARIA|^CONTA$/],
  ['plano', /PLANO/],
  ['item', /^ITEM|DESCRICAO|HISTORICO/],
  ['valor', /^VALOR/],
];
function impColunas(linhas) {
  for (let i = 0; i < Math.min(15, linhas.length); i++) {
    const col = {};
    (linhas[i] || []).forEach((h, j) => {
      const n = normTxt(h); if (!n) return;
      const k = IMP_COLS.find(([k, re]) => !(k in col) && re.test(n));
      if (k) col[k[0]] = j;
    });
    if (['data', 'plano', 'valor'].every(k => k in col)) return { col, ini: i + 1 };
  }
  return { col: { banco: 0, data: 1, plano: 3, item: 4, valor: 5, prog: 6, pag: 7 }, ini: 0 };
}

function casarPlano(txt) {
  const s = String(txt ?? '').trim(); if (!s) return null;
  const m = s.match(/^(\d+(?:\.\d+)*)\.?\s*[-–]?\s*(.*)$/);
  const cod = m ? m[1] : '', nome = normTxt(m ? m[2] : s);
  const P = S.plano_contas.map(p => ({ p, n: normTxt(p.nome) }));
  let c = P.filter(x => x.n === nome && nome);
  if (c.length) return (c.find(x => x.p.codigo === cod) || c[0]).p.id;
  if (nome.length >= 4) { c = P.filter(x => x.n.length >= 4 && (x.n.includes(nome) || nome.includes(x.n))); if (c.length === 1) return c[0].p.id; }
  if (!nome && cod) { c = P.filter(x => x.p.codigo === cod); if (c.length === 1) return c[0].p.id; }
  return null;
}
function casarBanco(txt, pid) {
  const n = normTxt(txt); if (!n) return null;
  const lista = bancosDaEmpresa(pid);
  const b = lista.find(x => normTxt(x.nome) === n) || S.bancos.find(x => normTxt(x.nome) === n);
  if (b) return b.id;
  const c = lista.filter(x => { const k = normTxt(x.nome); return k.length >= 4 && (k.includes(n) || n.includes(k)); });
  return c.length === 1 ? c[0].id : null;
}

function impAbrir() {
  if (!S.planilhas.length) return toast('Cadastre uma empresa antes de importar.', true);
  const inp = $('imp_arq'); if (!inp) return;
  inp.value = ''; inp.click();
}

async function impArquivo(arq) {
  if (!arq) return;
  let X;
  toast('Lendo a planilha…');
  try { X = await libXLSX(); } catch (e) { return toast(e.message, true); }
  let linhas;
  try {
    const wb = X.read(await arq.arrayBuffer(), { type: 'array', raw: false, cellDates: false });
    // usa a primeira aba que tenha os títulos de lançamentos (ou a primeira aba)
    const abas = wb.SheetNames.map(n => X.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: null, blankrows: false }));
    linhas = abas.find(l => impColunas(l).ini > 0) || abas[0] || [];
  } catch (e) { return toast('Não foi possível ler o arquivo. Use uma planilha Excel (.xlsx / .xls) ou CSV.', true); }
  const { col, ini } = impColunas(linhas);
  const get = (r, k) => k in col ? r[col[k]] : null;
  const L = [];
  for (let i = ini; i < linhas.length; i++) {
    const r = linhas[i] || [];
    if (!r.some(v => v != null && String(v).trim() !== '')) continue;
    const l = {
      n: i + 1,
      bancoTxt: String(get(r, 'banco') ?? '').trim(),
      data: impData(get(r, 'data')),
      planoTxt: String(get(r, 'plano') ?? '').trim(),
      item: String(get(r, 'item') ?? '').trim(),
      valor: impValor(get(r, 'valor')),
      prog: impData(get(r, 'prog')),
      pag: impData(get(r, 'pag')),
    };
    l.ign = !l.data ? 'Sem data' : l.valor == null ? 'Sem valor' : !l.planoTxt ? 'Sem conta' : '';
    L.push(l);
  }
  if (!L.length) return toast('Nenhum lançamento encontrado no arquivo.', true);

  // empresa de destino: a aba aberta, ou a que aparece no nome dos bancos (ex.: "DINHEIRO DK")
  const cont = {};
  for (const l of L) for (const p of S.planilhas) { const sg = normTxt(siglaEmpresa(p.id)); if (sg && new RegExp(`(^| )${sg}$`).test(normTxt(l.bancoTxt))) cont[p.id] = (cont[p.id] || 0) + 1; }
  const melhor = Object.entries(cont).sort((a, b) => b[1] - a[1])[0];
  const dest = melhor && Number(melhor[0]) !== S.planilhaId && melhor[1] > (cont[S.planilhaId] || 0) ? Number(melhor[0]) : S.planilhaId;
  IMP = { arq: arq.name, linhas: L, dest, detectou: dest !== S.planilhaId, mapB: {}, mapP: {}, filtro: '', exist: {}, salvando: false };
  impCasar();
  abrirModal(`<div id="imp"></div>`, 'm-imp', () => { IMP = null; });
  await impExistentes();
}

// casa bancos (dependem da empresa) e contas; o que não casar fica para o usuário escolher
function impCasar() {
  const memo = impMemo();
  const valido = (v, tab) => v === 0 || v === 'x' || (tab === 'b' ? !!M.banco[v] : !!M.plano[v]);
  const mapB = {}, mapP = {};
  for (const l of IMP.linhas) {
    const kb = normTxt(l.bancoTxt);
    if (kb && !(kb in mapB)) {
      const ant = IMP.mapB[kb], m = memo.banco[`${IMP.dest}|${kb}`];
      mapB[kb] = ant?.manual ? ant : casarBanco(l.bancoTxt, IMP.dest) != null ? { v: casarBanco(l.bancoTxt, IMP.dest), auto: true }
        : m != null && valido(m, 'b') ? { v: m, manual: true } : { v: '' };
      mapB[kb].txt = l.bancoTxt;
    }
    const kp = normTxt(l.planoTxt);
    if (kp && !(kp in mapP)) {
      const ant = IMP.mapP[kp], m = memo.plano[kp];
      mapP[kp] = ant?.manual ? ant : casarPlano(l.planoTxt) != null ? { v: casarPlano(l.planoTxt), auto: true }
        : m != null && valido(m, 'p') ? { v: m, manual: true } : { v: '' };
      mapP[kp].txt = l.planoTxt;
    }
  }
  IMP.mapB = mapB; IMP.mapP = mapP;
}

async function impExistentes() {
  const datas = IMP.linhas.map(l => l.data).filter(Boolean).sort();
  IMP.exist = {}; IMP.carregando = true; desenharImp();
  if (datas.length) {
    try {
      const ex = await store.lancs({ ini: datas[0], fim: datas.at(-1), planilha_id: IMP.dest });
      for (const l of ex) { const k = impChave(l.data_lancamento, l.valor, l.item); IMP.exist[k] = (IMP.exist[k] || 0) + 1; }
    } catch (e) { toast(e.message, true); }
  }
  IMP.carregando = false;
  if (IMP) desenharImp();
}
const impChave = (data, valor, item) => `${data}|${Number(valor).toFixed(2)}|${normTxt(item)}`;

// situação de cada linha: ok (pronta), dup (já existe), pend (falta escolher), skip (não importar), ign (inválida)
function impResolver() {
  const resto = { ...IMP.exist };
  return IMP.linhas.map(l => {
    const r = { l, banco_id: null, plano_id: null, st: 'ok', msg: '' };
    if (l.ign) return { ...r, st: 'ign', msg: l.ign };
    const mp = IMP.mapP[normTxt(l.planoTxt)];
    if (mp?.v === 'x') return { ...r, st: 'skip', msg: 'Não importar' };
    r.plano_id = mp?.v ? Number(mp.v) : null;
    const kb = normTxt(l.bancoTxt), mb = kb ? IMP.mapB[kb] : null;
    if (mb) r.banco_id = mb.v === '' || mb.v === 0 ? null : Number(mb.v);
    const k = impChave(l.data, l.valor, l.item);
    const dup = resto[k] > 0; if (dup) resto[k]--;
    if (!r.plano_id) { r.st = 'pend'; r.msg = 'Escolha a conta'; }
    else if (mb && mb.v === '') { r.st = 'pend'; r.msg = 'Escolha o banco'; }
    else if (dup) { r.st = 'dup'; r.msg = 'Já existe'; }
    r.pago = !!(l.pag && r.banco_id);
    r.sel = r.st === 'ok' || r.st === 'dup' ? (l.sel ?? r.st === 'ok') : false;
    return r;
  });
}

  const optsPlano = v => `<option value="">Escolha a conta…</option><option value="x" ${v === 'x' ? 'selected' : ''}>— Não importar estas linhas —</option>` + opcoesPlano(v).replace(/^<option value="">[^<]*<\/option>/, '');

          <div class="${m.v === '' ? 'pend' : ''}"><select data-chg="impPlano" data-k="${esc(k)}" data-busca>${optsPlano(m.v)}</select></div>`).join('')}
      </div>
    </div>` : '';
  const FIL = [['', 'Todas', R.length], ['ok', 'Prontas', cnt('ok')], ['dup', 'Já existem', cnt('dup')], ['pend', 'Pendências', cnt('pend')], ['ign', 'Ignoradas', cnt('ign') + cnt('skip')]];
  const vis = R.filter(r => !IMP.filtro || r.st === IMP.filtro || (IMP.filtro === 'ign' && r.st === 'skip'));

  const todos = selecionaveis.length && selecionaveis.every(r => r.sel);
  const SELO = { ok: r => r.pago ? `<span class="ist ok">✓ ${sinal({ plano_conta_id: r.plano_id }) > 0 ? 'Recebido' : 'Pago'}</span>` : `<span class="ist ab">Em aberto</span>`,
    dup: () => `<span class="ist dup" title="Já existe um lançamento com a mesma data, valor e descrição nesta empresa">Já existe</span>`,
    pend: r => `<span class="ist pend">${r.msg}</span>`, skip: r => `<span class="ist ign">${r.msg}</span>`, ign: r => `<span class="ist ign">${r.msg}</span>` };
  const linhas = vis.map(r => {
    const l = r.l, s = r.plano_id ? sinal({ plano_conta_id: r.plano_id }) : 0, g = r.plano_id ? grupoDoPlano(r.plano_id) : null;
    const pode = r.st === 'ok' || r.st === 'dup';
    return `<tr class="${s > 0 ? 'rec' : s < 0 ? 'desp' : ''} ${r.sel ? '' : 'off'}">
      <td class="c"><input type="checkbox" data-chg="impChk" data-i="${IMP.linhas.indexOf(l)}" ${r.sel ? 'checked' : ''} ${pode ? '' : 'disabled'}></td>
      <td class="c mut">${l.n}</td>

      <td>${r.banco_id ? bancoTag(M.banco[r.banco_id], 18) : l.bancoTxt ? `<span class="a-def">${esc(l.bancoTxt)}</span>` : '<span class="mut">—</span>'}</td>
      <td class="ls-c"><b>${esc(l.item || '')}</b><small>${g ? `<i style="background:${esc(corGrupo(g))}"></i>${esc(planoLabel(r.plano_id))}` : `<span class="neg">${esc(l.planoTxt || 'sem conta')}</span>`}</small></td>

    </div>`;

function impMapear(tipo, k, v) {
  if (!IMP) return;
  const map = tipo === 'b' ? IMP.mapB : IMP.mapP;
  const val = v === '' ? '' : v === 'x' ? 'x' : v === '0' ? 0 : Number(v);
  map[k] = { ...map[k], v: val, manual: val !== '', auto: false };
  if (val !== '') {
    const memo = impMemo();
    if (tipo === 'b') memo.banco[`${IMP.dest}|${k}`] = val; else memo.plano[k] = val;
    impMemoSalvar(memo);
  }
  desenharImp();
}

async function impConfirmar() {
  if (!IMP || IMP.salvando) return;
  const R = impResolver().filter(r => r.sel);
  if (!R.length) return toast('Nenhuma linha marcada para importar.', true);
  const origem = `IMP:${Date.now().toString(36)}`;
  const rows = R.map(({ l, banco_id, plano_id, pago }) => ({
    planilha_id: IMP.dest, banco_id, plano_conta_id: plano_id,
    data_lancamento: l.data, item: l.item || M.plano[plano_id]?.nome || '', valor: l.valor,
    data_programada: l.prog || l.data, data_pagamento: pago ? l.pag : null, origem,
  }));
  IMP.salvando = true; desenharImp();
  let feitos = 0;
  try {
    for (let i = 0; i < rows.length; i += 500) { await store.insertMany('lancamentos', rows.slice(i, i + 500)); feitos += Math.min(500, rows.length - i); }
  } catch (e) {
    if (IMP) { IMP.salvando = false; desenharImp(); }
    return toast(feitos ? `Importados ${feitos} de ${rows.length}. Erro: ${e.message}` : e.message, true);
  }
  // abre a empresa e o mês onde caiu a maior parte dos lançamentos
  const meses = {}; for (const r of rows) { const ym = r.data_lancamento.slice(0, 7); meses[ym] = (meses[ym] || 0) + 1; }
  const ymAtual = `${S.ano}-${pad(S.mes + 1)}`;
  if (!meses[ymAtual]) { const [a, m] = Object.entries(meses).sort((x, y) => y[1] - x[1])[0][0].split('-').map(Number); S.ano = a; S.mes = m - 1; }
  const dest = IMP.dest;
  fecharModal(true); IMP = null;
  S.planilhaId = dest; S.editId = null;
  if (S.view !== 'lancamentos') await irPara('lancamentos'); else await viewLancamentos();
  toast(`${rows.length} lançamento${rows.length === 1 ? '' : 's'} importado${rows.length === 1 ? '' : 's'} em ${siglaEmpresa(dest)}.`);
}

function svgParaPNG(svg) {

    const c = svg.cloneNode(true), vb = svg.viewBox.baseVal;
    c.querySelectorAll('.hit').forEach(h => h.remove());
    const css = `.gl{stroke:#e6e6e9;stroke-width:1}.zero{stroke:#9a9ba0;stroke-width:1.2}.ax{font:12px Arial,sans-serif;fill:#74757b}.linha{fill:none;stroke:#e0620f;stroke-width:2.5;stroke-linejoin:round}.area{fill:#f37021;opacity:.08}.pt{fill:#e0620f;stroke:#fff;stroke-width:2}.negp{fill:#c62828}`;
    c.insertAdjacentHTML('afterbegin', `<style>${css}</style>`);
    c.setAttribute('width', vb.width * 2); c.setAttribute('height', vb.height * 2);
    const i = new Image();
    i.onload = () => { const cv = document.createElement('canvas'); cv.width = vb.width * 2; cv.height = vb.height * 2; cv.getContext('2d').drawImage(i, 0, 0); ok({ url: cv.toDataURL('image/png'), w: vb.width, h: vb.height }); };
    i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(c));
  });
}

function campoHTML(c, val, row) {
  const v = val ?? c.def ?? (c.t === 'color' ? '#4caa4a' : '');
  if (c.t === 'select') return `<select id="c_${c.k}" ${c.req ? 'required' : ''}><option value="">${c.req ? 'Selecione…' : c.vazio ?? '— nenhum —'}</option>${c.opts().map(([id, n]) => `<option value="${id}" ${String(id) === String(v) ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
  if (c.t === 'money') return `<input id="c_${c.k}" inputmode="decimal" value="${val != null ? num2(val) : ''}" placeholder="0,00">`;
  if (c.t === 'image') return `<div class="imgf"><span id="c_${c.k}_prev">${iconeBanco({ logo: val, nome: row?.nome || '' }, 34)}</span>
      <input type="file" id="c_${c.k}_file" accept="image/*" data-chg="imgUpload" data-k="${c.k}">
      <button type="button" class="mini" data-act="imgLimpar" data-k="${c.k}" title="Volta ao ícone automático">Padrão</button>

  return `<input id="c_${c.k}" type="${c.t === 'color' ? 'color' : 'text'}" value="${esc(v)}" ${c.req ? 'required' : ''} placeholder="${esc(c.ph ?? '')}" class="${c.cls ?? ''}">`;
}
